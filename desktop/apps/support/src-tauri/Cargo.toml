[package]
name = "clickfix-support"
description = "ClickFix Destek: müşteri hızlı destek uygulaması"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "clickfix_support_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
clickfix-shell.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# Şeffaf çerçeve/çubuk pencereleri macOS'ta özel API ister.
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-deep-link.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-opener.workspace = true
tokio.workspace = true
url.workspace = true

# WebView2 yoksa pencere açılamaz; açıklama yerel iletişim kutusuyla yapılır.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[lints]
workspace = true
