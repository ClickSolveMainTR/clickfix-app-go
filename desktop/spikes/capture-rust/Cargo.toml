[package]
name = "capture-rust"
version = "0.1.0"
edition = "2024"
publish = false

# Kendi workspace'i: desktop/Cargo.toml workspace'ine dahil değil.
[workspace]

[dependencies]
scap = "=0.1.0-beta.1"
livekit = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
