  description: |
    # Hızlı başlangıç

    ClickFix REST API'si; konuşma açmanızı, mesaj ve iç not eklemenizi, kişi ve şirket verinizi senkron tutmanızı ve olaylara webhook ile abone olmanızı sağlar. Bu başvuruda yalnızca herkese açık ve kararlı uç noktalar yer alır; panelin kendi kullandığı iç uç noktalar burada listelenmez ve API anahtarıyla çağrılamaz.

    **Temel adres:** `https://api.getclickfix.com/v1/public-api`

    Beş dakikada ilk isteğiniz:

    1. Panelde **Organizasyon → API ve otomasyonlar → API anahtarları** sayfasını açın ve **Yeni API anahtarı**'na basın.
    2. Anahtara bir ad verin ve yalnızca ihtiyacınız olan kapsamları seçin. Bu örnek için `contacts:read` ve `conversations:write` yeterli.
    3. **Anahtar oluştur**'a basın ve `cf_sk_` ile başlayan anahtarı hemen kopyalayın. Anahtar yalnızca bir kez gösterilir.
    4. Anahtarı sunucunuzda bir ortam değişkenine koyun ve kişileri listeleyin:

    ```bash
    export CLICKFIX_API_KEY="cf_sk_..."

    curl "https://api.getclickfix.com/v1/public-api/contacts?limit=5" \
      -H "Authorization: Bearer $CLICKFIX_API_KEY"
    ```

    5. Bir kişi ve bir kanal (`inbox_uuid`) seçip konuşma açın. Yazma isteklerinde `Idempotency-Key` zorunludur:

    ```bash
    curl -X POST "https://api.getclickfix.com/v1/public-api/conversations" \
      -H "Authorization: Bearer $CLICKFIX_API_KEY" \
      -H "Content-Type: application/json" \
      -H "Idempotency-Key: siparis-1042-destek" \
      -d '{
        "contact_uuid": "KISI_UUID",
        "inbox_uuid": "KANAL_UUID",
        "subject": "Teslimat sorusu"
      }'
    ```

    Yanıt `201` ve `data.uuid` alanında konuşmanın kimliğini döner. Aynı isteği aynı `Idempotency-Key` ile tekrar gönderirseniz yeni konuşma açılmaz, ilk yanıt aynen döner.

    Sonraki adımlar: aşağıdaki **Kimlik doğrulama ve kapsamlar** ve **Webhook'lar** bölümleri, ardından uç nokta başvurusu. Kullanım kılavuzu: [getclickfix.com/docs/api](https://getclickfix.com/docs/api).

    # Kimlik doğrulama ve kapsamlar

    Her istek bir **API anahtarıyla** doğrulanır. Anahtarı `Authorization` başlığında `Bearer` olarak gönderin:

    ```http
    Authorization: Bearer cf_sk_...
    ```

    ## API anahtarı oluşturma

    1. **Organizasyon → API ve otomasyonlar → API anahtarları** sayfasını açın. Sayfayı görmek için organizasyonda API anahtarlarını yönetme yetkiniz olmalıdır.
    2. **Yeni API anahtarı**'na basın; anahtara entegrasyonu tanıtan bir ad verin (ör. "ERP senkronizasyonu").
    3. Yalnızca entegrasyonun ihtiyaç duyduğu **kapsamları** seçin.
    4. İsterseniz **dakikalık istek limiti** (1–6000, varsayılan 120) ve **son geçerlilik tarihi** belirleyin.
    5. **Anahtar oluştur**'a basın ve anahtarı kopyalayın. ClickFix anahtarın yalnızca özetini saklar; anahtar bir daha gösterilmez.

    Bir anahtarı aynı sayfadaki **İptal et** ile hemen geçersiz kılabilirsiniz. Anahtar sızdıysa önce iptal edin, sonra yenisini oluşturun.

    > API anahtarları yalnızca sunucuda kullanılır. Tarayıcı, mobil uygulama veya herkese açık bir depodaki koda koymayın.

    ## Anahtar hangi verilere erişir?

    - Anahtar oluşturulduğu **organizasyona** bağlıdır; `X-Organization` gibi bir başlık göndermeniz gerekmez.
    - Anahtar, onu oluşturan üyenin **güncel** yetkileriyle sınırlıdır. Üyenin yetkisi düşerse, üye pasifleşirse veya organizasyondan çıkarılırsa anahtar da aynı oranda kısıtlanır ya da çalışmaz.
    - Bir isteğin geçmesi için hem anahtarın ilgili **kapsamı** hem de üyenin ilgili **yetkisi** gerekir.

    ## Kapsamlar

    | Kapsam | İzin verdiği |
    |---|---|
    | `conversations:read` | Konuşmaları ve mesajları okuma |
    | `conversations:write` | Konuşma oluşturma ve güncelleme, mesaj ve iç not ekleme |
    | `contacts:read` | Kişileri okuma |
    | `contacts:write` | Kişileri güncelleme |
    | `companies:read` | Şirketleri okuma |
    | `triggers:read` | Tetikleyici olaylarını yoklama |
    | `webhooks:read` | Webhook aboneliklerini okuma |
    | `webhooks:write` | Webhook aboneliği oluşturma, güncelleme ve silme |
    | `revenue:write` | Şirket gelir verisi gönderme |
    | `health:write` | Şirket kullanım sinyali (0–100) gönderme |
    | `events:write` | Şirket zaman çizelgesine ürün olayı gönderme |

    Her uç noktanın gerektirdiği kapsam, başvurudaki açıklamasında yazar. Kapsam eksikse `403 FORBIDDEN` döner ve mesajda eksik kapsam belirtilir.

    # Yanıtlar ve hatalar

    Tüm yanıtlar aynı zarfı kullanır. Başarılı yanıt:

    ```json
    {
      "success": true,
      "data": { "uuid": "8f0e…", "status": "open" },
      "meta": { "request_id": "01JB…" }
    }
    ```

    Hatalı yanıt:

    ```json
    {
      "success": false,
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "Invalid input; writes require Idempotency-Key",
        "details": [{ "field": "subject", "message": "too long", "code": "max" }]
      },
      "meta": { "request_id": "01JB…" }
    }
    ```

    Hata yönetimini `error.code` değerine göre yapın; `message` metni bilgilendirme amaçlıdır ve değişebilir. Bize ulaştığınızda `meta.request_id` değerini paylaşın; isteği bu değerle buluruz.

    | HTTP | `error.code` | Ne zaman | Ne yapmalı |
    |---|---|---|---|
    | 400 | `VALIDATION_ERROR` | Gövde geçersiz, alan kuralı ihlal edildi veya yazma isteğinde `Idempotency-Key` yok | `details` alanına bakıp isteği düzeltin; aynı isteği tekrar denemeyin |
    | 401 | `UNAUTHENTICATED` | Anahtar yok, hatalı, iptal edilmiş veya süresi dolmuş | Anahtarı kontrol edin, gerekirse yenisini oluşturun |
    | 403 | `FORBIDDEN` | Anahtarın kapsamı veya anahtarı oluşturan üyenin yetkisi yetmiyor | Anahtara kapsamı ekleyin (yeni anahtar) veya üyenin rolünü güncelleyin |
    | 403 | `ENTITLEMENT_REQUIRED`, `PLAN_LIMIT_EXCEEDED`, `SUBSCRIPTION_READ_ONLY` | Organizasyonun planı bu özelliği içermiyor, kota doldu veya abonelik salt okunur | Organizasyon yöneticinizle planı gözden geçirin |
    | 404 | `NOT_FOUND` | Kayıt yok, başka organizasyona ait veya uç nokta herkese açık API'de yok | Kimliği ve yolu kontrol edin |
    | 409 | `IDEMPOTENCY_CONFLICT` | Aynı `Idempotency-Key` farklı bir istekle kullanıldı veya ilk istek hâlâ işleniyor | Yeni işlem için yeni anahtar üretin; işlenen istek için kısa bir süre sonra aynı anahtarla tekrar deneyin |
    | 410 | `CURSOR_EXPIRED` | Tetikleyici imleci artık geçerli değil | Kaynakları yeniden okuyup `cursor=0` ile baştan başlayın |
    | 429 | `RATE_LIMITED` | Anahtarın dakikalık limiti aşıldı | `Retry-After` saniye kadar bekleyip tekrar deneyin |
    | 502 | `RESULT_TOO_LARGE` | Yanıt çok büyük | `limit` değerini düşürün veya filtre ekleyin |
    | 500 | `INTERNAL_ERROR` | Beklenmeyen sunucu hatası | Üstel bekleme ile tekrar deneyin; sürerse `request_id` ile bize yazın |

    # Sayfalama

    Liste uç noktaları `limit` (varsayılan 20, en fazla 100) ve `offset` parametrelerini kabul eder ve sonucu tek bir yapıda döner:

    ```json
    {
      "success": true,
      "data": { "items": [], "total": 134, "limit": 20, "offset": 40 }
    }
    ```

    Sonraki sayfa için `offset` değerini `limit` kadar artırın; `items` boş geldiğinde veya `offset + limit >= total` olduğunda durun. Kişi listesi ayrıca `q` ile arama destekler.

    Sayfalama anlık görüntü almak içindir; çok sayıda kaydı sürekli senkron tutmak için sayfa sayfa yoklamak yerine **webhook** veya **tetikleyici yoklama** (`GET /triggers`, imleç tabanlı) kullanın.

    # Idempotency

    `GET` dışındaki her istekte `Idempotency-Key` başlığı **zorunludur** (en fazla 200 bayt).

    - Her mantıksal işlem için benzersiz bir değer üretin, ör. `siparis-1042-iade` veya bir UUID.
    - Ağ hatası veya zaman aşımında aynı isteği **aynı anahtar ve aynı gövdeyle** tekrar gönderin. ClickFix ilk tamamlanan yanıtı saklar ve aynen döner; işlem iki kez yapılmaz.
    - Anahtar 24 saat saklanır. Aynı anahtarı farklı bir gövde, yöntem veya yolla kullanırsanız `409 IDEMPOTENCY_CONFLICT` döner.
    - Saklanan yanıt bir hata ise (ör. `400`), aynı anahtarla tekrar denemek yine aynı hatayı döner. Girdiyi düzelttiyseniz yeni bir anahtar kullanın.
    - Mesaj gönderirken `client_id` alanı ek bir tekrar koruması sağlar.

    # Hız sınırları ve boyutlar

    - Her API anahtarının dakikalık bir istek limiti vardır: varsayılan **120**, anahtar oluştururken 1–6000 arasında ayarlanabilir.
    - Limit aşıldığında `429 RATE_LIMITED` ve `Retry-After` başlığı (saniye) döner. Bu süre kadar bekleyin, ardından üstel bekleme ve rastgele sapma (jitter) ile tekrar deneyin.
    - Birden çok entegrasyon için ayrı anahtar kullanın; limit anahtar başına uygulanır.
    - İstek gövdesi en fazla **128 KB** olabilir.
    - `400`, `401`, `403` ve `404` yanıtlarını tekrar denemeyin; önce isteği düzeltin.

    # Sürümleme

    - API'nin sürümü yoldadır: `/v1/...`. `v1` içinde yalnızca **geriye uyumlu** değişiklikler yapılır: yeni uç nokta, yeni isteğe bağlı alan, yeni olay türü, yeni hata kodu.
    - İstemciniz tanımadığı yanıt alanlarını ve olay türlerini yok saymalıdır.
    - Bir alanı kaldırmak, anlamını değiştirmek veya zorunlu alan eklemek gibi kırıcı değişiklikler yalnızca yeni bir ana sürümle (`/v2`) gelir ve önceden duyurulur; eski sürüm geçiş süresi boyunca çalışmaya devam eder.
    - Bu başvuruda yer almayan uç noktalar herkese açık API'nin parçası değildir ve haber verilmeden değişebilir.

    # Webhook'lar

    Webhook'lar, ClickFix'te bir olay olduğunda (yeni konuşma, gelen mesaj, SLA ihlali…) belirttiğiniz HTTPS adresine imzalı bir `POST` isteği gönderir. Böylece yoklama yapmadan sisteminizi güncel tutarsınız.

    ## Abonelik

    `webhooks:write` kapsamlı bir anahtarla `POST /webhooks` çağırın. Yanıttaki `data.secret` imza anahtarıdır ve **yalnızca oluşturma yanıtında** döner; güvenli bir yerde saklayın.

    - Adres `https://` olmalı ve herkese açık bir sunucuya işaret etmelidir; `localhost`, özel IP'ler ve yönlendirmeler (3xx) kabul edilmez.
    - Sunucunuz 10 saniye içinde `2xx` dönmelidir. Başarısız teslimatlar artan aralıklarla (1 dk, 5 dk, 30 dk, 2 sa, 6 sa, 12 sa, 24 sa) tekrar denenir; bu yüzden aynı olay birden fazla gelebilir.
    - Zapier, Make veya n8n gibi araçlar için `POST /subscriptions` (REST hook) aynı teslimat altyapısını kullanır.

    ## Olaylar

    | Grup | Olaylar |
    |---|---|
    | Konuşma | `conversation.created`, `conversation.updated`, `conversation.assigned`, `conversation.unassigned`, `conversation.status_changed`, `conversation.priority_changed`, `conversation.resolved`, `conversation.reopened`, `conversation.snoozed`, `conversation.tag_added` |
    | Mesaj | `message.received`, `message.sent`, `message.failed` |
    | Kişi ve şirket | `contact.created`, `contact.updated`, `contact.merged`, `company.created`, `company.updated` |
    | SLA | `sla.warning`, `sla.breached` |
    | Memnuniyet | `csat.submitted` |

    Listeye zamanla yeni olaylar eklenir; tanımadığınız olay türlerini yok sayın.

    ## İstek biçimi

    | Başlık | Açıklama |
    |---|---|
    | `ClickFix-Webhook-Id` | Teslimatın benzersiz kimliği. Tekrar denemelerde aynı kalır; tekilleştirmek için kullanın. |
    | `ClickFix-Webhook-Event` | Olay adı, ör. `conversation.created` |
    | `ClickFix-Webhook-Timestamp` | İsteğin imzalandığı an (Unix saniye) |
    | `ClickFix-Webhook-Signature` | `v1=` + onaltılık (hex) HMAC-SHA256 imzası |

    ```json
    {
      "id": "6c1d…",
      "event": "conversation.created",
      "version": 1,
      "occurred_at": "2026-10-29T10:15:00Z",
      "data": { "conversation_uuid": "8f0e…", "status": "open", "channel_type": "whatsapp" }
    }
    ```

    `data` içeriği olaya göre değişir ve yalnızca kimlikleri ve özet alanları taşır. Ayrıntı gerekiyorsa kaydı API ile okuyun.

    Konuşma olayları kişinin ve şirketin dış kimliğini de taşır (`contact_external_id`, `company_external_id`); ayrıntı için **Dış kimlik ve doğrulanmış müşteri** bölümüne bakın.

    ## İmza doğrulama

    ```text
    ClickFix-Webhook-Signature = "v1=" + hex(HMAC-SHA256(secret, timestamp + "." + ham_gövde))
    ```

    1. Gövdeyi JSON olarak ayrıştırmadan önce, gelen **ham baytlarla** imzayı hesaplayın.
    2. Sonucu başlıktaki değerle **sabit zamanlı** karşılaştırın.
    3. Zaman damgası 5 dakikadan eski veya ileriyse isteği reddedin.
    4. `ClickFix-Webhook-Id` değerini kaydedin; aynı kimlik tekrar gelirse işlemi yinelemeyin.
    5. Olayı kalıcı olarak kaydettikten sonra `2xx` dönün; uzun işleri arka planda yapın.

    **Node.js**

    ```js
    import crypto from "node:crypto";

    export function verifyClickFix(rawBody, timestamp, signature, secret) {
      const age = Math.abs(Date.now() / 1000 - Number(timestamp));
      if (!signature || !Number.isFinite(age) || age > 300) return false;
      const expected =
        "v1=" +
        crypto.createHmac("sha256", secret).update(`${timestamp}.`).update(rawBody).digest("hex");
      const a = Buffer.from(expected);
      const b = Buffer.from(signature);
      return a.length === b.length && crypto.timingSafeEqual(a, b);
    }
    ```

    **Python**

    ```python
    import hashlib, hmac, time

    def verify_clickfix(raw_body: bytes, timestamp: str, signature: str, secret: str) -> bool:
        try:
            if abs(time.time() - int(timestamp)) > 300:
                return False
        except (TypeError, ValueError):
            return False
        mac = hmac.new(secret.encode(), f"{timestamp}.".encode() + raw_body, hashlib.sha256)
        return hmac.compare_digest("v1=" + mac.hexdigest(), signature or "")
    ```

    **Go**

    ```go
    err := clickfix.VerifyWebhook(secret,
        r.Header.Get("ClickFix-Webhook-Timestamp"),
        r.Header.Get("ClickFix-Webhook-Signature"),
        rawBody, time.Now(), 5*time.Minute)
    ```

    ## API kanalı

    Kendi sohbet uygulamanızı veya sisteminizi ClickFix'e bir kanal olarak bağlamak için **API kanalı** kullanılır. Kanal kurulduğunda size bir gelen adresi (`/v1/webhooks/channels/api/{instance}`) ve imza anahtarı verilir. Müşteri mesajlarını bu adrese gönderirsiniz (aşağıda **API kanalı** başlığı altında), temsilcilerin yanıtları ise kanalda tanımladığınız adrese `apiChannelReply` webhook'u olarak gelir. İmza başlıkları `X-ClickFix-Timestamp` ve `X-ClickFix-Signature: sha256=…` biçimindedir; hesaplama yukarıdakiyle aynıdır.

    # SDK'lar ve örnek kod

    Go ve Node.js için sunucu SDK'ları vardır: `@clickfix/node` (npm, Node 22+), `@clickfix/react-widget` (npm, React 18+) ve `github.com/ClickSolveMainTR/clickfix-app-go/sdks/go` (Go modülü, `sdks/go/vX.Y.Z` etiketleri). Tüm diller için kullanım örnekleri [SDK'lar ve örnek kod](https://getclickfix.com/docs/sdks) sayfasında, baştan sona kurulum sırası ve her adımda doğrulanmış örnekler [Entegrasyon kılavuzu](https://getclickfix.com/docs/integration-guide) sayfasındadır. SDK'lar kimlik doğrulama, sınırlı tekrar deneme (`Retry-After` dahil), sayfalama ve webhook imza doğrulaması sağlar. Temel adres olarak `https://api.getclickfix.com` verin (sonuna `/v1` eklemeyin). Her uç noktanın sağ panelinde curl, JavaScript, Python ve Go için hazır istek örnekleri de bulunur.

    **curl**

    ```bash
    curl -X POST "https://api.getclickfix.com/v1/public-api/conversations/KONUSMA_UUID/messages" \
      -H "Authorization: Bearer $CLICKFIX_API_KEY" \
      -H "Content-Type: application/json" \
      -H "Idempotency-Key: siparis-1042-not" \
      -d '{ "content": "Sipariş kargoya verildi.", "private": true }'
    ```

    **JavaScript / TypeScript (Node.js 22+)**

    ```ts
    import { createClient } from "@clickfix/node";

    const client = createClient({
      baseURL: "https://api.getclickfix.com",
      apiKey: process.env.CLICKFIX_API_KEY!,
    });

    const created = await client.request(
      "/v1/public-api/conversations",
      "post",
      { contact_uuid: contactUUID, inbox_uuid: inboxUUID, subject: "Teslimat sorusu" },
      { idempotencyKey: "siparis-1042-destek" },
    );
    ```

    SDK kullanmadan `fetch` ile:

    ```ts
    const res = await fetch("https://api.getclickfix.com/v1/public-api/contacts?limit=20", {
      headers: { Authorization: `Bearer ${process.env.CLICKFIX_API_KEY}` },
    });
    const body = await res.json();
    if (!body.success) throw new Error(`${body.error.code}: ${body.error.message}`);
    ```

    **Go**

    ```go
    client, err := clickfix.New("https://api.getclickfix.com", os.Getenv("CLICKFIX_API_KEY"))
    if err != nil {
        log.Fatal(err)
    }
    res, err := client.GetV1PublicApiContactsWithResponse(ctx, &clickfix.GetV1PublicApiContactsParams{})
    ```

    **Python (requests)**

    ```python
    import os, requests

    API = "https://api.getclickfix.com/v1/public-api"
    headers = {"Authorization": f"Bearer {os.environ['CLICKFIX_API_KEY']}"}

    contacts = requests.get(f"{API}/contacts", params={"limit": 20}, headers=headers, timeout=30).json()

    created = requests.post(
        f"{API}/conversations",
        json={"contact_uuid": contact_uuid, "inbox_uuid": inbox_uuid, "subject": "Teslimat sorusu"},
        headers={**headers, "Idempotency-Key": "siparis-1042-destek"},
        timeout=30,
    ).json()
    ```

    `Idempotency-Key` için işlemi tanımlayan sabit bir değer (ör. sipariş numarası) kullanın ve tekrar denemelerde aynı değeri gönderin; her denemede yeni değer üretmeyin.

    # Dış kimlik ve doğrulanmış müşteri

    Kendi sisteminizdeki kullanıcı numarasını ClickFix'te **dış kimlik** (`external_id`) olarak tutarsınız. Kişi ve şirket dış kimlikleri ayrı alanlardır: kişinin `external_id` değeri sizin kullanıcı numaranızdır, şirketin `external_id` değeri sizin firma numaranızdır. İkisi de organizasyon içinde tekildir.

    | Kayıt | Alan | Widget `identify` karşılığı |
    |---|---|---|
    | Kişi | `external_id` | `user_id` |
    | Şirket | `external_id` | `company.id` |

    ## Kişiyi dış kimlikle senkron tutun

    `PUT /contacts/by-external-id` kişiyi dış kimliğiyle oluşturur ya da günceller. Aynı dış kimlikle ikinci çağrı yeni kişi açmaz, mevcut kişiyi günceller. Yanıt kişi oluşturulduysa `201`, güncellendiyse `200` döner. Kapsam `contacts:write`; anahtarı oluşturan üyenin kişi yazma yetkisi de aranır.

    ```bash
    curl -X PUT "https://api.getclickfix.com/v1/public-api/contacts/by-external-id" \
      -H "Authorization: Bearer $CLICKFIX_API_KEY" \
      -H "Content-Type: application/json" \
      -H "Idempotency-Key: kullanici-1001-v3" \
      -d '{ "external_id": "1001", "name": "Ayşe Yılmaz", "email": "ayse@example.com" }'
    ```

    - Eşleşme yalnızca dış kimlikle yapılır. E-posta veya telefon üzerinden başka bir kişi devralınmaz; sitede adresini yazmış anonim bir ziyaretçi bu kişiye karışmaz.
    - Başka bir kişide olan bir dış kimliği atamaya çalışırsanız `409 EXTERNAL_ID_EXISTS` döner.
    - Her değişiklik için yeni bir `Idempotency-Key` kullanın; aynı anahtar ilk yanıtı tekrar döndürür.

    Kişiyi bulmak için `GET /contacts?external_id=1001`, şirketi bulmak için `GET /companies?external_id=F-77` kullanın.

    ## Müşteri siteye girmeden ilk mesaj

    Konuşmayı `contact_external_id` ile açabilirsiniz; ayrı bir kanal gerekmez:

    ```bash
    curl -X POST "https://api.getclickfix.com/v1/public-api/conversations" \
      -H "Authorization: Bearer $CLICKFIX_API_KEY" \
      -H "Content-Type: application/json" \
      -H "Idempotency-Key: hosgeldin-1001" \
      -d '{ "contact_external_id": "1001", "inbox_uuid": "WIDGET_KANAL_UUID", "subject": "Hoş geldiniz" }'
    ```

    Ardından `POST /conversations/{uuid}/messages` ile mesajı yazın. Kanal web widget'ı ise kullanıcı sitenize girip `identify` ile oturum açtığında konuşmayı ve mesajı widget'ta görür.

    ## Doğrulanmış, anonim, adını kendisi yazdı

    Kişi ve konuşma yanıtlarında `identity_state` alanı vardır:

    | Değer | Anlamı |
    |---|---|
    | `verified` | Kişi widget `identify` çağrısında `user_hash` ile kimliğini kanıtladı. `verified_at` son doğrulama zamanıdır. |
    | `anonymous` | Ad, e-posta veya telefon yok. |
    | `self_named` | Kişi ya da kanalı bir ad, e-posta veya telefon verdi, ama kanıtlanmadı. |

    API ile oluşturulan kişi, kullanıcı `identify` ile oturum açana kadar doğrulanmış sayılmaz.

    ## Webhook'larda dış kimlik

    Konuşma olaylarının `data` alanı `contact_external_id`, `contact_verified`, `company_uuid` ve `company_external_id` taşır; `contact.created` olayı `contact_external_id` taşır. Kendi kaydınızı ek bir istek atmadan eşleştirebilirsiniz.
