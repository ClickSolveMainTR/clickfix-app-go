            format: uuid
  /v1/public-api/triggers:
    get:
      operationId: pollIntegrationTriggers
      summary: Tetikleyici olaylarını yokla
      tags:
        - Tetikleyiciler
      security:
        - integrationKey: []
      description: "Kapsam: `triggers:read`. Seçilen olay türü için `cursor` değerinden sonraki olayları döner; ilk çağrıda `cursor=0` gönderin ve yanıttaki imleci saklayın. Yanıtlar konuşma metnini değil, kayıt kimliklerini içerir. İmleç süresi dolarsa `410 CURSOR_EXPIRED` döner."
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/IntegrationTriggerPage"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
                required:
                  - success
                  - data
                  - meta
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: "CURSOR_EXPIRED: resynchronize resources and restart with cursor=0"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: event
          in: query
          required: true
          schema:
            type: string
            enum:
              - conversation.created
              - conversation.resolved
              - contact.created
              - csat.submitted
              - conversation.tag_added
        - name: cursor
          in: query
          schema:
            type: string
          example: "0"
  /v1/public-api/subscriptions:
    post:
      operationId: subscribeIntegrationTrigger
      summary: REST hook aboneliği oluştur
      tags:
        - Tetikleyiciler
      security:
        - integrationKey: []
      description: "Kapsam: `webhooks:write`. Zapier, Make ve n8n gibi araçların kullandığı REST hook aboneliği; webhook'larla aynı imzalı teslimat altyapısını kullanır. İmza anahtarı yalnızca bu yanıtta döner. `Idempotency-Key` zorunludur."
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
                required:
                  - success
                  - data
                  - meta
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
          example: workflow-42-step-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationSubscription"
            example:
              name: Zapier new conversation
              url: https://hooks.example.com/clickfix
              events:
                - conversation.created
              enabled: true
  /v1/public-api/subscriptions/{uuid}:
    delete:
