          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationContactUpdate"
            example:
              name: Updated contact
  /v1/webhooks/channels/api/{instance}:
    post:
      operationId: receiveAPIChannelMessage
      summary: Müşteri mesajı gönder
      description: |
        API kanalına bir müşteri mesajı gönderir. Kanal **Kanallar → Kanal ekle → API** ile kurulur; kurulumda gelen adresi (`{instance}`), imza anahtarını ve temsilci yanıtlarının gönderileceği adresi alırsınız.

        İstek API anahtarıyla değil kanalın imza anahtarıyla doğrulanır: `X-ClickFix-Timestamp` (Unix saniye) ve `X-ClickFix-Signature: sha256=` + hex(HMAC-SHA256(imza_anahtarı, timestamp + "." + ham_gövde)). Zaman damgası 5 dakikadan eskiyse istek reddedilir. Aynı `id` ile gelen mesaj bir kez kaydedilir. `5xx` yanıtında tekrar deneyin.
      security:
        - apiChannelSignature: []
      parameters:
        - name: instance
          in: path
          required: true
          description: Kanal kurulumunda verilen kanal kimliği.
          schema:
            type: string
        - name: X-ClickFix-Timestamp
          in: header
          required: true
          description: İmzalama anı (Unix saniye).
          schema:
            type: string
          example: "1761732900"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIChannelMessage"
            example:
              id: msg-1001
              sender_id: musteri-42
              sender_name: Ayşe Yılmaz
              text: Siparişim ne zaman gelir?
      responses:
        "200":
          description: Mesaj alındı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWebhookReceived"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - API kanalı
webhooks:
  apiChannelReply:
    post:
      tags:
        - API kanalı
      operationId: deliverAPIChannelReply
      summary: Temsilci yanıtı (API kanalı)
      description: |
        Bir temsilci API kanalındaki konuşmayı yanıtladığında ClickFix, kanalda tanımladığınız adrese bu gövdeyle `POST` gönderir. İstek `X-ClickFix-Timestamp`, `X-ClickFix-Signature` (yukarıdaki imza yöntemi) ve `Idempotency-Key` (mesaj UUID'si) başlıklarını taşır; her anahtarı yalnızca bir kez işleyin. Mesajı kalıcı olarak kaydettikten sonra `2xx` dönün. Geçici hatalar artan aralıklarla tekrar denenir; `408` ve `429` dışındaki `4xx` yanıtları kalıcı hata sayılır.
      security: []
      parameters:
        - name: X-ClickFix-Timestamp
          in: header
          required: true
          schema:
            type: string
            description: Unix seconds
        - name: X-ClickFix-Signature
          in: header
          required: true
          schema:
            type: string
            description: sha256= followed by hex HMAC-SHA256
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIChannelReply"
      responses:
        "200":
          description: Durably accepted, including duplicate id
        "204":
          description: Durably accepted, including duplicate id
        "400":
          description: Permanent content rejection
        "401":
          description: Permanent authentication rejection
        "429":
          description: Rate limit, retried with backoff
        "500":
          description: Temporary receiver failure, retried with backoff
components:
  schemas:
    APIChannelMessage:
      type: object
      required:
        - id
        - sender_id
        - text
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable unique message ID within this instance
        sender_id:
          type: string
          minLength: 1
          maxLength: 255
        sender_name:
          type: string
        text:
          type: string
          minLength: 1
          maxLength: 32000
        thread_id:
          type: string
          maxLength: 255
        reply_to:
          type: string
        at:
          type: string
          format: date-time
    APIChannelReply:
      type: object
      description: JSON posted to the organization's public webhook URL with timestamped HMAC and Idempotency-Key.
      required:
        - id
        - conversation_id
        - recipient_id
        - text
        - thread_id
        - reply_to
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        recipient_id:
          type: string
        text:
          type: string
        thread_id:
          type: string
        reply_to:
          type: string
    CompanyEvent:
      type: object
      required:
        - uuid
        - company_uuid
        - name
        - properties
        - source
        - occurred_at
        - duplicate
      properties:
        uuid:
          type: string
          format: uuid
        company_uuid:
          type: string
          format: uuid
        name:
          type: string
        properties:
          type: object
          additionalProperties: true
        source:
          type: string
        occurred_at:
          type: string
          format: date-time
        duplicate:
          type: boolean
    CompanyEventInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        company_uuid:
          type: string
          format: uuid
        external_id:
          type: string
        domain:
          type: string
        contact_email:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: seat_limit_reached
        properties:
          type: object
          additionalProperties: true
        source:
          type: string
          maxLength: 32
          default: api
        idempotency_key:
          type: string
          maxLength: 200
        occurred_at:
          type: string
          format: date-time
    CompanyRevenue:
      type: object
      description: What the customer pays the organization. Amounts are minor units of `currency`.
      required:
        - mrr_minor
        - currency
        - plan
        - billing_status
        - renewal_at
        - lifetime_value_minor
        - source
        - external_ref
        - updated_at
      properties:
        mrr_minor:
          type: integer
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
        plan:
          type: string
        billing_status:
          type: string
          enum:
            - none
            - trialing
            - active
            - past_due
            - canceled
        renewal_at:
          type:
            - string
            - "null"
          format: date-time
        lifetime_value_minor:
          type: integer
          format: int64
        source:
          type: string
          enum:
            - manual
            - api
            - stripe
            - iyzico
        external_ref:
          type: string
        updated_at:
          type: string
          format: date-time
    CompanyRevenueUpsertInput:
      type: object
      additionalProperties: false
      properties:
        company_uuid:
          type: string
          format: uuid
        external_id:
          type: string
        domain:
          type: string
        source:
          type: string
          enum:
            - api
            - stripe
            - iyzico
        mrr_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Za-z]{3}$
        plan:
          type: string
          maxLength: 120
        billing_status:
          type: string
          enum:
            - none
            - trialing
            - active
            - past_due
            - canceled
        renewal_at:
          type:
            - string
            - "null"
          description: RFC 3339 time or YYYY-MM-DD date; null clears it.
        lifetime_value_minor:
          type: integer
          format: int64
          minimum: 0
        external_ref:
          type: string
          maxLength: 200
    CompanyUsageInput:
      type: object
      additionalProperties: false
      required:
        - score
      properties:
        company_uuid:
          type: string
          format: uuid
        external_id:
          type: string
        domain:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
    Contact:
      type: object
      required:
        - uuid
        - name
        - email
        - phone
        - external_id
        - identity_state
        - verified_at
        - job_title
        - company
        - locale
        - timezone
        - notes
        - custom_fields
        - blocked
        - channel_types
        - conversation_count
        - last_seen_at
        - created_at
        - updated_at
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        email:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        external_id:
          type:
            - string
            - "null"
          description: the customer's own user id, unique in the organization.
        identity_state:
          $ref: "#/components/schemas/ContactIdentityState"
        verified_at:
          type:
            - string
            - "null"
          format: date-time
          description: Last widget identify that proved the id with user_hash.
        job_title:
          type: string
        company:
          oneOf:
            - $ref: "#/components/schemas/InboxRef"
            - type: "null"
        locale:
          type:
            - string
            - "null"
        timezone:
          type:
            - string
            - "null"
        notes:
          type: string
        custom_fields:
          type: object
          additionalProperties: true
        blocked:
          type: boolean
        channel_types:
          type: array
          items:
            type: string
        conversation_count:
          type: integer
          format: int64
        identities:
          type: array
          items:
            $ref: "#/components/schemas/ContactIdentity"
        last_seen_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactIdentity:
      type: object
      required:
        - id
        - channel_type
        - inbox_uuid
        - external_id
        - display_name
        - username
        - last_seen_at
        - created_at
      properties:
        id:
          type: integer
          format: int64
        channel_type:
          type: string
        inbox_uuid:
          type:
            - string
            - "null"
          format: uuid
        external_id:
          type: string
        display_name:
          type: string
        username:
          type: string
        last_seen_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
    ContactIdentityState:
      type: string
      enum:
        - verified
        - anonymous
        - self_named
      description: |
        . verified: the contact proved the customer's user id with
        user_hash (widget identify). anonymous: no name, e-mail or phone.
        self_named: a name, e-mail or phone the contact or its channel gave,
        not proved.
    ContactInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
        phone:
          type: string
        job_title:
          type: string
          maxLength: 120
        company:
          type:
            - string
            - "null"
          format: uuid
        locale:
          type: string
        timezone:
          type: string
        notes:
          type: string
        custom_fields:
          type: object
          additionalProperties: true
        blocked:
          type: boolean
        external_id:
          type: string
          maxLength: 200
          description: the customer's own user id; empty clears it. 409 EXTERNAL_ID_EXISTS when another contact has it.
    ConversationPriority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent
    ConversationStatus:
      type: string
      enum:
        - open
        - pending
        - snoozed
        - resolved
        - closed
    ConversationUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/ConversationStatus"
        priority:
          $ref: "#/components/schemas/ConversationPriority"
        subject:
          type: string
          maxLength: 500
        assignee:
          type:
            - string
            - "null"
          format: uuid
        team:
          type:
            - string
            - "null"
          format: uuid
          description: Team uuid; null removes the team (tenant.conversations.assign)
        snoozed_until:
          type: string
          format: date-time
    EnvelopeCompanyEvent:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/CompanyEvent"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    EnvelopeCompanyRevenueUpsert:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - company_uuid
            - revenue
          properties:
            company_uuid:
              type: string
              format: uuid
            revenue:
              $ref: "#/components/schemas/CompanyRevenue"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    EnvelopeCompanyUsage:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - company_uuid
            - usage_score
          properties:
            company_uuid:
              type: string
              format: uuid
            usage_score:
              type: integer
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    EnvelopeContact:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/Contact"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    EnvelopeWebhookReceived:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - received
          properties:
            received:
              type: boolean
              enum:
                - true
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Error:
      type: object
      required:
        - success
        - error
        - meta
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
            - VALIDATION_ERROR
            - INVALID_RESET_CODE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PASSWORD_RESET_FAILED
            - INTERNAL_ERROR
            - MFA_REQUIRED
            - INVALID_MFA_CODE
            - RATE_LIMITED
            - STEP_UP_REQUIRED
            - ACCOUNT_DEACTIVATED
            - INVALID_EMAIL_CODE
            - INVALID_ID_TOKEN
            - OAUTH_ACCOUNT_NOT_LINKED
            - OAUTH_LINK_CHOICE_REQUIRED
            - INVALID_LINK_TICKET
            - OAUTH_PROVIDER_DISABLED
            - ORGANIZATION_REQUIRED
            - NO_TENANT_MEMBERSHIP
            - ORGANIZATION_SUSPENDED
            - ORGANIZATION_ACCESS_EXPIRED
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    InboxRef:
      type: object
      required:
        - uuid
        - name
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
    IntegrationContactUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
      additionalProperties: false
    IntegrationCreateConversation:
      type: object
      description: Name the contact by contact_uuid or contact_external_id (, the customer's own user id), not both. On a widget inbox a contact with an external id gets its widget identity, so the agent can write first and the signed-in user finds the conversation on the site.
      properties:
        contact_uuid:
          type: string
          format: uuid
        contact_external_id:
          type: string
          maxLength: 200
        inbox_uuid:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - inbox_uuid
        - subject
      additionalProperties: false
    IntegrationEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data: {}
        meta:
          type: object
          properties:
            request_id:
              type: string
      required:
        - success
        - data
    IntegrationSubscription:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - conversation.created
              - conversation.resolved
              - contact.created
              - csat.submitted
              - conversation.tag_added
          minItems: 1
        enabled:
          type: boolean
      required:
        - name
        - url
        - events
        - enabled
      additionalProperties: false
    IntegrationTrigger:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event:
          type: string
          enum:
            - conversation.created
            - conversation.resolved
            - contact.created
            - csat.submitted
            - conversation.tag_added
        entity_uuid:
          type:
            - string
            - "null"
          format: uuid
        occurred_at:
          type: string
          format: date-time
      required:
        - id
        - event
        - entity_uuid
        - occurred_at
      additionalProperties: false
    IntegrationTriggerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationTrigger"
        next_cursor:
          type: string
        has_more:
          type: boolean
        retention_days:
          type: integer
      required:
        - items
        - next_cursor
        - has_more
        - retention_days
      additionalProperties: false
    OutboundWebhookInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        url:
          type: string
          format: uri
          description: Public HTTPS URL. Private addresses, redirects and DNS rebinding are blocked.
        events:
          type: array
          minItems: 1
          items:
            type: string
        enabled:
          type: boolean
      required:
        - name
        - url
        - events
        - enabled
    ResponseMeta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
  responses:
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: "`VALIDATION_ERROR`: `details[].field` names each invalid field (dotted path, e.g. `company.tax_number`, `business_hours.days.2.end`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    apiChannelSignature:
      type: apiKey
      in: header
      name: X-ClickFix-Signature
      description: API kanalının imza anahtarıyla hesaplanan `sha256=` + hex(HMAC-SHA256(secret, timestamp + "." + ham_gövde)). `X-ClickFix-Timestamp` (Unix saniye) başlığıyla birlikte gönderilir.
    integrationKey:
      type: http
      scheme: bearer
      bearerFormat: cf_sk_…
      description: "Organizasyon API anahtarı (`cf_sk_…`). Organizasyon → API ve otomasyonlar → API anahtarları sayfasında oluşturulur; `Authorization: Bearer cf_sk_…` başlığıyla gönderilir."
