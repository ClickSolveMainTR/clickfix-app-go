          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        format: uuid
                      number:
                        type: integer
                      status:
                        type: string
                    required:
                      - uuid
                      - number
                      - status
                    additionalProperties: false
                  meta:
