  conversation: &conversation
    uuid: "8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f"
    number: 1042
    status: open
    priority: normal
    subject: Delivery question
    inbox: { uuid: "c2a9d7e4-1f3b-4c5d-8e6f-7a8b9c0d1e2f", name: Web widget }
    contact: { uuid: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d", name: Ayşe Yılmaz, external_id: "1001", identity_state: verified }
    assignee: { uuid: "5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f", name: Mehmet Kaya }
    external_thread_id: null
    created_at: "2026-11-11T09:15:00Z"
    updated_at: "2026-11-11T09:15:00Z"
  contact: &contact
    uuid: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
    name: Ayşe Yılmaz
    email: ayse@example.com
    phone: "+905551112233"
    external_id: "1001"
    identity_state: verified
    verified_at: "2026-11-10T18:42:11Z"
    job_title: Operations manager
    company: { uuid: "0f9e8d7c-6b5a-4493-8271-605f4e3d2c1b", name: Acme Ltd., external_id: "F-77" }
    locale: tr
    timezone: Europe/Istanbul
    notes: ""
    custom_fields: { plan: pro, seats: 12 }
    blocked: false
    channel_types: [widget, email]
    conversation_count: 3
    last_seen_at: "2026-11-11T09:14:50Z"
    created_at: "2026-10-01T07:00:00Z"
    updated_at: "2026-11-11T09:14:50Z"
  meta: &meta { request_id: "01JCK9ZQ3M8R2W7X5E4T1N0PAB" }
  message: &message
    uuid: "3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f"
