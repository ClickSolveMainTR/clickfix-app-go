# Presentation of the tenant-facing public API (backend/docs/public-api.yaml).
#
# The public spec is generated by `sdks/scripts/public-api.mjs` (`make sdks`)
# from the operations of backend/docs/openapi.yaml marked `x-public: true`;
# CI (`make sdks-check`) fails when the committed file is stale. This file only
# adds the customer-facing layer: info, guides, Turkish tags and summaries.
# Every `x-public: true` operation must have an entry under `operations`, and
# every entry must match a marked operation (the generator enforces both).

info:
  title: ClickFix API
  version: "v1"
  summary: Konuşmalar, kişiler, şirketler ve webhook'lar için herkese açık REST API
  contact:
    name: ClickFix Destek
    email: destek@getclickfix.com
    url: https://getclickfix.com/docs/api
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.getclickfix.com
    description: Üretim

# Concatenated, in order, into info.description (rendered as the introduction).
guides:
  - 01-hizli-baslangic.md
  - 02-kimlik-dogrulama.md
  - 03-istekler-ve-hatalar.md
  - 04-webhooklar.md
  - 05-sdkler.md
  - 06-dis-kimlik.md

securitySchemes:
  integrationKey:
    description: "Organizasyon API anahtarı (`cf_sk_…`). Organizasyon → API ve otomasyonlar → API anahtarları sayfasında oluşturulur; `Authorization: Bearer cf_sk_…` başlığıyla gönderilir."
  apiChannelSignature:
    type: apiKey
    in: header
    name: X-ClickFix-Signature
    description: "API kanalının imza anahtarıyla hesaplanan `sha256=` + hex(HMAC-SHA256(secret, timestamp + \".\" + ham_gövde)). `X-ClickFix-Timestamp` (Unix saniye) başlığıyla birlikte gönderilir."

tags:
  - name: Konuşmalar
    description: Konuşma oluşturma, okuma, güncelleme; mesaj ve iç not ekleme.
  - name: Kişiler
    description: Son müşterilerinizin kişi kayıtları; kendi kullanıcı numaranızla (dış kimlik) senkron tutulabilir.
  - name: Şirketler
    description: Şirket listesi ve müşteri sağlığı için gelir, kullanım ve ürün olayı sinyalleri.
  - name: Webhook'lar
    description: Olay aboneliklerini yönetme. Teslimat biçimi ve imza doğrulama için giriş bölümündeki "Webhook'lar" başlığına bakın.
  - name: Tetikleyiciler
    description: Zapier, Make ve n8n gibi araçlar için imleç tabanlı yoklama ve REST hook aboneliği.
  - name: API kanalı
    description: Kendi sohbet sisteminizi ClickFix'e kanal olarak bağlama. Müşteri mesajlarını gönderirsiniz; temsilci yanıtları webhook ile size gelir.

operations:
  createIntegrationConversation:
    tag: Konuşmalar
    summary: Konuşma oluştur
    description: "Kapsam: `conversations:write`. Kişiyi `contact_uuid` ya da kendi kullanıcı numaranızla `contact_external_id` olarak verin. Kişi ve kanal (`inbox_uuid`) anahtarın organizasyonuna ait olmalı ve kanal etkin olmalıdır. Web widget kanalında kişi siteye girip `identify` ile oturum açtığında konuşmayı görür. Konuşma, anahtarı oluşturan üyeye atanır. `Idempotency-Key` zorunludur."
  getV1PublicApiConversations:
    tag: Konuşmalar
    summary: Konuşmaları listele
    description: "Kapsam: `conversations:read`. Sayfalı liste (`limit`, `offset`); anahtarı oluşturan üyenin görebildiği konuşmalarla sınırlıdır."
  getV1PublicApiConversationsUuid:
    tag: Konuşmalar
    summary: Konuşmayı getir
    description: "Kapsam: `conversations:read`."
  patchV1PublicApiConversationsUuid:
    tag: Konuşmalar
    summary: Konuşmayı güncelle
    description: "Kapsam: `conversations:write`. Durum, öncelik, konu, atanan temsilci, ekip ve erteleme zamanını (`snoozed_until`) günceller; yalnızca gönderdiğiniz alanlar değişir. `Idempotency-Key` zorunludur."
  getV1PublicApiConversationsUuidMessages:
    tag: Konuşmalar
    summary: Mesajları listele
    description: "Kapsam: `conversations:read`. Konuşmanın mesajları ve iç notları, sayfalı."
  postV1PublicApiConversationsUuidMessages:
    tag: Konuşmalar
    summary: Mesaj veya iç not ekle
    description: "Kapsam: `conversations:write`. `private: true` iç not ekler (müşteriye gitmez); aksi hâlde yanıt kanalın üzerinden müşteriye gönderilir. `client_id` ile ek tekrar koruması sağlayın. `Idempotency-Key` zorunludur."
  getV1PublicApiContacts:
    tag: Kişiler
    summary: Kişileri listele
    description: "Kapsam: `contacts:read`. `q` ile kişi adında veya e-postasında arama yapılabilir (büyük/küçük harf duyarsız). `external_id` kendi kullanıcı numaranızla tam eşleşir. Kayıtlar `external_id`, `verified_at` ve şirketin `company_external_id` alanını taşır."
  postV1PublicApiContacts:
    tag: Kişiler
    summary: Kişi oluştur
    description: "Kapsam: `contacts:write`. Kendi sisteminizdeki kullanıcıları senkron tutmak için `PUT /contacts/by-external-id` tercih edin. `Idempotency-Key` zorunludur."
  putV1PublicApiContactByExternalId:
    tag: Kişiler
    summary: Kişiyi dış kimlikle oluştur veya güncelle
    description: "Kapsam: `contacts:write`. `external_id` zorunludur ve sizin kullanıcı numaranızdır (widget `identify` içindeki `user_id`). Bu kimlikte kişi varsa güncellenir (`200`), yoksa oluşturulur (`201`); e-posta veya telefonla eşleşme yapılmaz. Başka kişideki bir kimlik `409 EXTERNAL_ID_EXISTS` döner. `Idempotency-Key` zorunludur."
  updateIntegrationContact:
    tag: Kişiler
    summary: Kişiyi güncelle
    description: "Kapsam: `contacts:write`. Paneldeki kişi doğrulama kuralları aynen uygulanır. `Idempotency-Key` zorunludur."
  getV1PublicApiCompanies:
    tag: Şirketler
    summary: Şirketleri listele
    description: "Kapsam: `companies:read`. `external_id` firmanın sizin sisteminizdeki numarasıyla tam eşleşir; kişi dış kimliklerinden ayrıdır."
  putV1PublicApiCompanyRevenue:
    tag: Şirketler
    summary: Şirket gelirini gönder
    description: "Kapsam: `revenue:write`. Şirket `company_uuid`, yoksa `external_id` (kendi sisteminizdeki kimlik), yoksa `domain` ile bulunur. Aynı `Idempotency-Key` farklı gövdeyle kullanılırsa `409` döner."
  putV1PublicApiCompanyUsage:
    tag: Şirketler
    summary: Şirket kullanım sinyalini gönder
    description: "Kapsam: `health:write`. Kendi ürününüzden 0–100 arası kullanım sinyali; 30 gün boyunca müşteri sağlığı puanına katılır. Şirket `company_uuid`, `external_id` veya `domain` ile bulunur. `Idempotency-Key` zorunludur."
  postV1PublicApiCompanyEvent:
    tag: Şirketler
    summary: Şirket zaman çizelgesine olay gönder
    description: "Kapsam: `events:write`. Ürününüzdeki önemli bir olayı (ör. plan yükseltme, hata) şirketin zaman çizelgesine ekler. `contact_email` olayı bilinen bir kişiye bağlar. Tekrarlanan `idempotency_key` kayıtlı olayı `duplicate: true` ile döner."
  getV1PublicApiWebhooks:
    tag: Webhook'lar
    summary: Webhook aboneliklerini listele
    description: "Kapsam: `webhooks:read`. İmza anahtarı (`secret`) listede dönmez."
  postV1PublicApiWebhooks:
    tag: Webhook'lar
    summary: Webhook aboneliği oluştur
    description: "Kapsam: `webhooks:write`. Adres herkese açık bir HTTPS adresi olmalıdır. İmza anahtarı (`secret`) yalnızca bu yanıtta döner. `Idempotency-Key` zorunludur."
  putV1PublicApiWebhooksUuid:
    tag: Webhook'lar
    summary: Webhook aboneliğini güncelle
    description: "Kapsam: `webhooks:write`. Ad, adres, olaylar ve etkinlik durumunu değiştirir; imza anahtarı değişmez. `Idempotency-Key` zorunludur."
  deleteV1PublicApiWebhooksUuid:
    tag: Webhook'lar
    summary: Webhook aboneliğini sil
    description: "Kapsam: `webhooks:write`. `Idempotency-Key` zorunludur."
  pollIntegrationTriggers:
    tag: Tetikleyiciler
    summary: Tetikleyici olaylarını yokla
    description: "Kapsam: `triggers:read`. Seçilen olay türü için `cursor` değerinden sonraki olayları döner; ilk çağrıda `cursor=0` gönderin ve yanıttaki imleci saklayın. Yanıtlar konuşma metnini değil, kayıt kimliklerini içerir. İmleç süresi dolarsa `410 CURSOR_EXPIRED` döner."
  subscribeIntegrationTrigger:
    tag: Tetikleyiciler
    summary: REST hook aboneliği oluştur
    description: "Kapsam: `webhooks:write`. Zapier, Make ve n8n gibi araçların kullandığı REST hook aboneliği; webhook'larla aynı imzalı teslimat altyapısını kullanır. İmza anahtarı yalnızca bu yanıtta döner. `Idempotency-Key` zorunludur."
  unsubscribeIntegrationTrigger:
    tag: Tetikleyiciler
    summary: REST hook aboneliğini sil
    description: "Kapsam: `webhooks:write`. `Idempotency-Key` zorunludur; tekrar denemelerde aynı değeri kullanın."

# Operations that exist in openapi.yaml under a generic path; the public spec
# shows the customer-facing variant. `from` must point at an existing operation.
derived:
  - from: { path: "/v1/webhooks/channels/{type}/{instance}", method: post }
    path: "/v1/webhooks/channels/api/{instance}"
    method: post
    operationId: receiveAPIChannelMessage
    tag: API kanalı
    summary: Müşteri mesajı gönder
    description: |
      API kanalına bir müşteri mesajı gönderir. Kanal **Kanallar → Kanal ekle → API** ile kurulur; kurulumda gelen adresi (`{instance}`), imza anahtarını ve temsilci yanıtlarının gönderileceği adresi alırsınız.

      İstek API anahtarıyla değil kanalın imza anahtarıyla doğrulanır: `X-ClickFix-Timestamp` (Unix saniye) ve `X-ClickFix-Signature: sha256=` + hex(HMAC-SHA256(imza_anahtarı, timestamp + "." + ham_gövde)). Zaman damgası 5 dakikadan eskiyse istek reddedilir. Aynı `id` ile gelen mesaj bir kez kaydedilir. `5xx` yanıtında tekrar deneyin.
    security: [{ apiChannelSignature: [] }]
    parameters:
      - name: instance
        in: path
        required: true
        description: Kanal kurulumunda verilen kanal kimliği.
        schema: { type: string }
      - name: X-ClickFix-Timestamp
        in: header
        required: true
        description: İmzalama anı (Unix saniye).
        schema: { type: string }
        example: "1761732900"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIChannelMessage" }
          example:
            id: "msg-1001"
            sender_id: "musteri-42"
            sender_name: "Ayşe Yılmaz"
            text: "Siparişim ne zaman gelir?"
    responses:
      "200":
        description: Mesaj alındı.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvelopeWebhookReceived" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthenticated" }
      "404": { $ref: "#/components/responses/NotFound" }

webhooks:
  apiChannelReply:
    tag: API kanalı
    summary: Temsilci yanıtı (API kanalı)
    description: |
      Bir temsilci API kanalındaki konuşmayı yanıtladığında ClickFix, kanalda tanımladığınız adrese bu gövdeyle `POST` gönderir. İstek `X-ClickFix-Timestamp`, `X-ClickFix-Signature` (yukarıdaki imza yöntemi) ve `Idempotency-Key` (mesaj UUID'si) başlıklarını taşır; her anahtarı yalnızca bir kez işleyin. Mesajı kalıcı olarak kaydettikten sonra `2xx` dönün. Geçici hatalar artan aralıklarla tekrar denenir; `408` ve `429` dışındaki `4xx` yanıtları kalıcı hata sayılır.
