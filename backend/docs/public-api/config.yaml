# Presentation of the tenant-facing public API (backend/docs/public-api.yaml).
#
# The public spec is generated by `sdks/scripts/public-api.mjs` (`make sdks`)
# from the operations of backend/docs/openapi.yaml marked `x-public: true`;
# CI (`make sdks-check`) fails when the committed file is stale. This file only
# adds the customer-facing layer: info, tags, summaries, descriptions, request
# and response examples and the Turkish translation. The spec itself is
# English; every `tr:` block becomes an `x-i18n: { tr: ... }` extension that the
# docs site applies to build the Turkish reference (`pnpm docs:sync`).
# Every `x-public: true` operation must have an entry under `operations`, and
# every entry must match a marked operation (the generator enforces both).
# Code samples (curl, Node.js, Go, PHP) are generated per operation by
# `sdks/scripts/code-samples.mjs` into `x-codeSamples`.

info:
  title: ClickFix API
  version: "v1"
  summary: Public REST API for conversations, contacts, companies, webhooks and the API channel
  description: |
    The ClickFix REST API lets you open conversations, add messages and internal notes, keep contacts and companies in sync with your own system, send customer-health signals and subscribe to events. Base URL `https://api.getclickfix.com/v1/public-api`; every request carries `Authorization: Bearer cf_sk_…`; writes require `Idempotency-Key`.

    Guides: [API keys, envelope, errors, pagination, rate limits](https://getclickfix.com/docs/api) · [Integration guide](https://getclickfix.com/docs/integration-guide) · [SDKs](https://getclickfix.com/docs/integration-guide/sdks) · [Webhooks](https://getclickfix.com/docs/webhooks).
  contact:
    name: ClickFix Support
    email: destek@getclickfix.com
    url: https://getclickfix.com/docs/api
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  tr:
    summary: Konuşmalar, kişiler, şirketler, webhook'lar ve API kanalı için herkese açık REST API
    description: |
      ClickFix REST API'si konuşma açmanızı, mesaj ve iç not eklemenizi, kişi ve şirketleri kendi sisteminizle senkron tutmanızı, müşteri sağlığı sinyali göndermenizi ve olaylara abone olmanızı sağlar. Temel adres `https://api.getclickfix.com/v1/public-api`; her istek `Authorization: Bearer cf_sk_…` taşır; yazma isteklerinde `Idempotency-Key` zorunludur.

      Kılavuzlar: [API anahtarları, zarf, hatalar, sayfalama, hız sınırları](https://getclickfix.com/docs/api) · [Entegrasyon kılavuzu](https://getclickfix.com/docs/integration-guide) · [SDK'lar](https://getclickfix.com/docs/integration-guide/sdks) · [Webhook'lar](https://getclickfix.com/docs/webhooks).

servers:
  - url: https://api.getclickfix.com
    description: Production
    tr: { description: Üretim }

securitySchemes:
  integrationKey:
    description: "Organization API key (`cf_sk_…`), created under Organization → API and automations → API keys and sent as `Authorization: Bearer cf_sk_…`."
    tr:
      description: "Organizasyon API anahtarı (`cf_sk_…`). Organizasyon → API ve otomasyonlar → API anahtarları sayfasında oluşturulur; `Authorization: Bearer cf_sk_…` başlığıyla gönderilir."
  apiChannelSignature:
    type: apiKey
    in: header
    name: X-ClickFix-Signature
    description: "`sha256=` + hex(HMAC-SHA256(secret, timestamp + \".\" + raw_body)), computed with the API channel's signing secret and sent together with `X-ClickFix-Timestamp` (Unix seconds)."
    tr:
      description: "API kanalının imza anahtarıyla hesaplanan `sha256=` + hex(HMAC-SHA256(secret, timestamp + \".\" + ham_gövde)). `X-ClickFix-Timestamp` (Unix saniye) başlığıyla birlikte gönderilir."

tags:
  - name: Conversations
    description: Create, read and update conversations; add messages and internal notes.
    tr: { name: Konuşmalar, description: "Konuşma oluşturma, okuma, güncelleme; mesaj ve iç not ekleme." }
  - name: Contacts
    description: Contact records of your end customers, kept in sync with your own user ids (external ids).
    tr: { name: Kişiler, description: "Son müşterilerinizin kişi kayıtları; kendi kullanıcı numaranızla (dış kimlik) senkron tutulabilir." }
  - name: Companies
    description: Company list and the revenue, usage and product-event signals that feed customer health.
    tr: { name: Şirketler, description: "Şirket listesi ve müşteri sağlığı için gelir, kullanım ve ürün olayı sinyalleri." }
  - name: Webhooks
    description: Manage event subscriptions. Delivery format and signature verification are described in the Webhooks guide.
    tr: { name: Webhook'lar, description: "Olay aboneliklerini yönetme. Teslimat biçimi ve imza doğrulama Webhook'lar kılavuzundadır." }
  - name: Triggers
    description: Cursor-based polling and REST hook subscriptions for tools such as Zapier, Make and n8n.
    tr: { name: Tetikleyiciler, description: "Zapier, Make ve n8n gibi araçlar için imleç tabanlı yoklama ve REST hook aboneliği." }
  - name: API channel
    description: Connect your own chat system to ClickFix as a channel. You send customer messages; agent replies reach you by webhook.
    tr: { name: API kanalı, description: "Kendi sohbet sisteminizi ClickFix'e kanal olarak bağlama. Müşteri mesajlarını gönderirsiniz; temsilci yanıtları webhook ile size gelir." }
  - name: Apps
    description: Public keys of the developer platform; verifying the signed context an embedded app receives.
    tr: { name: Uygulamalar, description: "Geliştirici platformunun açık anahtarları; gömülü bir uygulamanın aldığı imzalı bağlamı doğrulama." }

# Shared example values.
