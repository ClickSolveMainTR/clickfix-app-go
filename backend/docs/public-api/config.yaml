    name: ERP sync
    url: https://erp.example.com/clickfix/webhook
    events: [conversation.created, message.received, contact.updated]
    enabled: true
    created_at: "2026-11-01T10:00:00Z"

operations:
  getV1PublicApiConversations:
    tag: Conversations
    summary: List conversations
    description: "Scope: `conversations:read`. Paged list (`limit`, `offset`), limited to the conversations the member who created the key can see. `external_thread_id` returns the API channel conversations of one of your threads (the `thread_id` you sent); every conversation carries `external_thread_id`."
    tr:
      summary: Konuşmaları listele
      description: "Kapsam: `conversations:read`. Sayfalı liste (`limit`, `offset`); anahtarı oluşturan üyenin görebildiği konuşmalarla sınırlıdır. `external_thread_id`, API kanalında kendi konu kimliğinize (gönderdiğiniz `thread_id`) ait konuşmaları döner; her konuşma `external_thread_id` alanını taşır."
    examples:
      responses:
        "200": { success: true, data: { items: [*conversation], total: 134, limit: 20, offset: 0 }, meta: *meta }
  createIntegrationConversation:
    tag: Conversations
    summary: Create a conversation
    description: "Scope: `conversations:write`. Give the contact as `contact_uuid` or, with your own user id, as `contact_external_id`. Contact and channel (`inbox_uuid`) must belong to the key's organization and the channel must be active. On a web widget channel the contact sees the conversation once they sign in on your site with `identify`. The conversation is assigned to the member who created the key. `Idempotency-Key` is required."
    tr:
      summary: Konuşma oluştur
      description: "Kapsam: `conversations:write`. Kişiyi `contact_uuid` ya da kendi kullanıcı numaranızla `contact_external_id` olarak verin. Kişi ve kanal (`inbox_uuid`) anahtarın organizasyonuna ait olmalı ve kanal etkin olmalıdır. Web widget kanalında kişi siteye girip `identify` ile oturum açtığında konuşmayı görür. Konuşma, anahtarı oluşturan üyeye atanır. `Idempotency-Key` zorunludur."
    examples:
      request: { contact_external_id: "1001", inbox_uuid: "c2a9d7e4-1f3b-4c5d-8e6f-7a8b9c0d1e2f", subject: Delivery question }
      responses:
        "201": { success: true, data: { uuid: "8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f", number: 1042, status: open }, meta: *meta }
  getV1PublicApiConversationsUuid:
    tag: Conversations
    summary: Get a conversation
    description: "Scope: `conversations:read`."
    tr: { summary: Konuşmayı getir, description: "Kapsam: `conversations:read`." }
    examples:
      responses:
        "200": { success: true, data: *conversation, meta: *meta }
  patchV1PublicApiConversationsUuid:
    tag: Conversations
    summary: Update a conversation
    description: "Scope: `conversations:write`. Updates status, priority, subject, assignee, team and snooze time (`snoozed_until`); only the fields you send change. `Idempotency-Key` is required."
    tr:
      summary: Konuşmayı güncelle
      description: "Kapsam: `conversations:write`. Durum, öncelik, konu, atanan temsilci, ekip ve erteleme zamanını (`snoozed_until`) günceller; yalnızca gönderdiğiniz alanlar değişir. `Idempotency-Key` zorunludur."
    examples:
      request: { status: pending, priority: high, assignee: "5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f" }
      responses:
        "200": { success: true, data: { <<: *conversation, status: pending, priority: high }, meta: *meta }
  getV1PublicApiConversationsUuidMessages:
    tag: Conversations
    summary: List messages
    description: "Scope: `conversations:read`. Messages and internal notes of the conversation, paged."
    tr: { summary: Mesajları listele, description: "Kapsam: `conversations:read`. Konuşmanın mesajları ve iç notları, sayfalı." }
    examples:
      responses:
        "200": { success: true, data: { items: [*message], total: 1, limit: 20, offset: 0 }, meta: *meta }
  postV1PublicApiConversationsUuidMessages:
    tag: Conversations
    summary: Add a message or internal note
    description: "Scope: `conversations:write`. `private: true` adds an internal note (never delivered to the customer); otherwise the reply is sent to the customer through the channel. `client_id` adds extra duplicate protection. `Idempotency-Key` is required."
    tr:
      summary: Mesaj veya iç not ekle
      description: "Kapsam: `conversations:write`. `private: true` iç not ekler (müşteriye gitmez); aksi hâlde yanıt kanalın üzerinden müşteriye gönderilir. `client_id` ile ek tekrar koruması sağlayın. `Idempotency-Key` zorunludur."
    examples:
      request: { content: "The order has shipped.", private: true, client_id: "6f1c0e3a-0d0b-4a4e-9a51-3c8b7d2f1e90" }
      responses:
        "201": { success: true, data: { <<: *message, private: true, content: "The order has shipped." }, meta: *meta }
  getV1PublicApiContacts:
    tag: Contacts
    summary: List contacts
    description: "Scope: `contacts:read`. `q` searches name and email (case-insensitive). `external_id` matches your own user id exactly. Records carry `external_id`, `verified_at` and the company's `company_external_id`."
    tr:
      summary: Kişileri listele
      description: "Kapsam: `contacts:read`. `q` ile kişi adında veya e-postasında arama yapılabilir (büyük/küçük harf duyarsız). `external_id` kendi kullanıcı numaranızla tam eşleşir. Kayıtlar `external_id`, `verified_at` ve şirketin `company_external_id` alanını taşır."
    examples:
      responses:
        "200": { success: true, data: { items: [*contact], total: 1, limit: 20, offset: 0 }, meta: *meta }
  postV1PublicApiContacts:
    tag: Contacts
    summary: Create a contact
    description: "Scope: `contacts:write`. To keep the users of your own system in sync prefer `PUT /contacts/by-external-id`. `Idempotency-Key` is required."
    tr:
      summary: Kişi oluştur
      description: "Kapsam: `contacts:write`. Kendi sisteminizdeki kullanıcıları senkron tutmak için `PUT /contacts/by-external-id` tercih edin. `Idempotency-Key` zorunludur."
    examples:
      request: { name: Ayşe Yılmaz, email: ayse@example.com, phone: "+905551112233", external_id: "1001", locale: tr, custom_fields: { plan: pro } }
      responses:
        "201": { success: true, data: { <<: *contact, identity_state: self_named, verified_at: null, conversation_count: 0, channel_types: [] }, meta: *meta }
  putV1PublicApiContactByExternalId:
    tag: Contacts
    summary: Create or update a contact by external id
    description: "Scope: `contacts:write`. `external_id` is required and is your own user id (the `user_id` of the widget `identify` call). If a contact with that id exists it is updated (`200`), otherwise created (`201`); no matching by email or phone. An id that belongs to another contact returns `409 EXTERNAL_ID_EXISTS`. `Idempotency-Key` is required."
    tr:
      summary: Kişiyi dış kimlikle oluştur veya güncelle
      description: "Kapsam: `contacts:write`. `external_id` zorunludur ve sizin kullanıcı numaranızdır (widget `identify` içindeki `user_id`). Bu kimlikte kişi varsa güncellenir (`200`), yoksa oluşturulur (`201`); e-posta veya telefonla eşleşme yapılmaz. Başka kişideki bir kimlik `409 EXTERNAL_ID_EXISTS` döner. `Idempotency-Key` zorunludur."
    examples:
      request: { external_id: "1001", name: Ayşe Yılmaz, email: ayse@example.com, custom_fields: { plan: pro, seats: 12 } }
      responses:
        "200": { success: true, data: *contact, meta: *meta }
        "201": { success: true, data: { <<: *contact, identity_state: self_named, verified_at: null, conversation_count: 0, channel_types: [] }, meta: *meta }
  updateIntegrationContact:
    tag: Contacts
    summary: Update a contact
    description: "Scope: `contacts:write`. The panel's contact validation rules apply as is. `Idempotency-Key` is required."
    tr: { summary: Kişiyi güncelle, description: "Kapsam: `contacts:write`. Paneldeki kişi doğrulama kuralları aynen uygulanır. `Idempotency-Key` zorunludur." }
    examples:
      request: { name: Ayşe Yılmaz, phone: "+905551112233", notes: VIP customer }
      responses:
        "200": { success: true, data: { <<: *contact, notes: VIP customer }, meta: *meta }
  getV1PublicApiCompanies:
    tag: Companies
    summary: List companies
    description: "Scope: `companies:read`. `external_id` matches the company's id in your own system exactly; it is separate from contact external ids."
    tr:
      summary: Şirketleri listele
      description: "Kapsam: `companies:read`. `external_id` firmanın sizin sisteminizdeki numarasıyla tam eşleşir; kişi dış kimliklerinden ayrıdır."
    examples:
      responses:
        "200":
          success: true
          data:
            items:
              - uuid: "0f9e8d7c-6b5a-4493-8271-605f4e3d2c1b"
                name: Acme Ltd.
                domain: acme.example
                external_id: "F-77"
                verified: true
                health: { score: 82, usage: 90, trend: up }
                revenue: { mrr_minor: 490000, currency: TRY, plan: pro, billing_status: active }
                contact_count: 4
                created_at: "2026-09-12T08:00:00Z"
                updated_at: "2026-11-11T09:00:00Z"
            total: 1
            limit: 20
            offset: 0
          meta: *meta
  putV1PublicApiCompanyRevenue:
    tag: Companies
    summary: Send company revenue
    description: "Scope: `revenue:write`. The company is found by `company_uuid`, else `external_id` (its id in your system), else `domain`. The same `Idempotency-Key` with a different body returns `409`."
    tr:
      summary: Şirket gelirini gönder
      description: "Kapsam: `revenue:write`. Şirket `company_uuid`, yoksa `external_id` (kendi sisteminizdeki kimlik), yoksa `domain` ile bulunur. Aynı `Idempotency-Key` farklı gövdeyle kullanılırsa `409` döner."
    examples:
      request: { external_id: "F-77", source: api, mrr_minor: 490000, currency: TRY, plan: pro, billing_status: active, renewal_at: "2026-12-01T00:00:00Z", lifetime_value_minor: 5880000, external_ref: sub_9f3k2 }
      responses:
        "200":
          success: true
          data:
            company_uuid: "0f9e8d7c-6b5a-4493-8271-605f4e3d2c1b"
            revenue: { mrr_minor: 490000, currency: TRY, plan: pro, billing_status: active, renewal_at: "2026-12-01T00:00:00Z", lifetime_value_minor: 5880000, source: api, external_ref: sub_9f3k2, updated_at: "2026-11-11T09:30:00Z" }
          meta: *meta
  putV1PublicApiCompanyUsage:
    tag: Companies
    summary: Send a company usage signal
    description: "Scope: `health:write`. A 0–100 usage signal from your own product; it counts towards the customer-health score for 30 days. The company is found by `company_uuid`, `external_id` or `domain`. `Idempotency-Key` is required."
    tr:
      summary: Şirket kullanım sinyalini gönder
      description: "Kapsam: `health:write`. Kendi ürününüzden 0–100 arası kullanım sinyali; 30 gün boyunca müşteri sağlığı puanına katılır. Şirket `company_uuid`, `external_id` veya `domain` ile bulunur. `Idempotency-Key` zorunludur."
    examples:
      request: { external_id: "F-77", score: 90 }
      responses:
        "200": { success: true, data: { company_uuid: "0f9e8d7c-6b5a-4493-8271-605f4e3d2c1b", score: 90, expires_at: "2026-12-11T09:30:00Z" }, meta: *meta }
  postV1PublicApiCompanyEvent:
    tag: Companies
    summary: Send an event to the company timeline
    description: "Scope: `events:write`. Adds a notable event of your product (e.g. plan upgrade, error) to the company's timeline. `contact_email` links the event to a known contact. A repeated `idempotency_key` returns the stored event with `duplicate: true`."
    tr:
      summary: Şirket zaman çizelgesine olay gönder
      description: "Kapsam: `events:write`. Ürününüzdeki önemli bir olayı (ör. plan yükseltme, hata) şirketin zaman çizelgesine ekler. `contact_email` olayı bilinen bir kişiye bağlar. Tekrarlanan `idempotency_key` kayıtlı olayı `duplicate: true` ile döner."
    examples:
      request: { external_id: "F-77", name: seat_limit_reached, properties: { seats: 12, limit: 12 }, contact_email: ayse@example.com, source: billing, idempotency_key: "evt-2026-11-11-f77-seats", occurred_at: "2026-11-11T09:31:00Z" }
      responses:
        "201":
          success: true
          data: { uuid: "9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d", company_uuid: "0f9e8d7c-6b5a-4493-8271-605f4e3d2c1b", name: seat_limit_reached, properties: { seats: 12, limit: 12 }, source: billing, occurred_at: "2026-11-11T09:31:00Z", duplicate: false }
          meta: *meta
        "200":
          success: true
          data: { uuid: "9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d", company_uuid: "0f9e8d7c-6b5a-4493-8271-605f4e3d2c1b", name: seat_limit_reached, properties: { seats: 12, limit: 12 }, source: billing, occurred_at: "2026-11-11T09:31:00Z", duplicate: true }
          meta: *meta
  getV1PublicApiWebhooks:
    tag: Webhooks
    summary: List webhook subscriptions
    description: "Scope: `webhooks:read`. The signing secret (`secret`) is not returned in the list."
    tr: { summary: Webhook aboneliklerini listele, description: "Kapsam: `webhooks:read`. İmza anahtarı (`secret`) listede dönmez." }
    examples:
      responses:
        "200": { success: true, data: { items: [*webhook], total: 1, limit: 20, offset: 0 }, meta: *meta }
  postV1PublicApiWebhooks:
    tag: Webhooks
    summary: Create a webhook subscription
    description: "Scope: `webhooks:write`. The URL must be a public HTTPS address. The signing secret (`secret`) is returned only in this response. `Idempotency-Key` is required."
    tr:
      summary: Webhook aboneliği oluştur
      description: "Kapsam: `webhooks:write`. Adres herkese açık bir HTTPS adresi olmalıdır. İmza anahtarı (`secret`) yalnızca bu yanıtta döner. `Idempotency-Key` zorunludur."
    examples:
      request: { name: ERP sync, url: https://erp.example.com/clickfix/webhook, events: [conversation.created, message.received, contact.updated], enabled: true }
      responses:
        "201": { success: true, data: { <<: *webhook, secret: "whsec_3f9c1a7e5b2d4c8f0a6e9b1d3c5f7a2e4b6d8c0f1a3e5b7d9c2f4a6e8b0d1c3f" }, meta: *meta }
  putV1PublicApiWebhooksUuid:
    tag: Webhooks
    summary: Update a webhook subscription
    description: "Scope: `webhooks:write`. Changes name, URL, events and enabled state; the signing secret stays the same. `Idempotency-Key` is required."
    tr:
      summary: Webhook aboneliğini güncelle
      description: "Kapsam: `webhooks:write`. Ad, adres, olaylar ve etkinlik durumunu değiştirir; imza anahtarı değişmez. `Idempotency-Key` zorunludur."
    examples:
      request: { name: ERP sync, url: https://erp.example.com/clickfix/webhook, events: [conversation.created, conversation.resolved, message.received], enabled: true }
      responses:
        "200": { success: true, data: { <<: *webhook, events: [conversation.created, conversation.resolved, message.received] }, meta: *meta }
  deleteV1PublicApiWebhooksUuid:
    tag: Webhooks
    summary: Delete a webhook subscription
    description: "Scope: `webhooks:write`. `Idempotency-Key` is required."
    tr: { summary: Webhook aboneliğini sil, description: "Kapsam: `webhooks:write`. `Idempotency-Key` zorunludur." }
    examples:
      responses:
        "200": { success: true, data: { deleted: true }, meta: *meta }
  pollIntegrationTriggers:
    tag: Triggers
    summary: Poll trigger events
    description: "Scope: `triggers:read`. Returns the events of the chosen type after `cursor`; send `cursor=0` on the first call and keep the cursor from the response. Responses carry record ids, not conversation text. An expired cursor returns `410 CURSOR_EXPIRED`."
    tr:
      summary: Tetikleyici olaylarını yokla
      description: "Kapsam: `triggers:read`. Seçilen olay türü için `cursor` değerinden sonraki olayları döner; ilk çağrıda `cursor=0` gönderin ve yanıttaki imleci saklayın. Yanıtlar konuşma metnini değil, kayıt kimliklerini içerir. İmleç süresi dolarsa `410 CURSOR_EXPIRED` döner."
    examples:
      responses:
        "200":
          success: true
          data:
            items:
              - { id: "2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f", event: conversation.created, entity_uuid: "8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f", conversation_uuid: "8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f", occurred_at: "2026-11-11T09:15:00Z" }
            next_cursor: "1762852500000:2c3d4e5f"
            has_more: false
            retention_days: 7
          meta: *meta
  subscribeIntegrationTrigger:
    tag: Triggers
    summary: Create a REST hook subscription
    description: "Scope: `webhooks:write`. The REST hook subscription used by tools such as Zapier, Make and n8n; it shares the signed delivery infrastructure of webhooks. The signing secret is returned only in this response. `Idempotency-Key` is required."
    tr:
      summary: REST hook aboneliği oluştur
      description: "Kapsam: `webhooks:write`. Zapier, Make ve n8n gibi araçların kullandığı REST hook aboneliği; webhook'larla aynı imzalı teslimat altyapısını kullanır. İmza anahtarı yalnızca bu yanıtta döner. `Idempotency-Key` zorunludur."
    examples:
      request: { name: Zapier new conversation, url: https://hooks.zapier.com/hooks/catch/123456/abcdef, events: [conversation.created], enabled: true }
      responses:
        "200": { success: true, data: { uuid: "6e5d4c3b-2a19-4f8e-9d7c-6b5a4f3e2d1c", name: Zapier new conversation, url: https://hooks.zapier.com/hooks/catch/123456/abcdef, events: [conversation.created], enabled: true, secret: "whsec_a4f0…" }, meta: *meta }
  unsubscribeIntegrationTrigger:
    tag: Triggers
    summary: Delete a REST hook subscription
    description: "Scope: `webhooks:write`. `Idempotency-Key` is required; reuse the same value on retries."
    tr:
      summary: REST hook aboneliğini sil
      description: "Kapsam: `webhooks:write`. `Idempotency-Key` zorunludur; tekrar denemelerde aynı değeri kullanın."
    examples:
      responses:
        "200": { success: true, data: { deleted: true }, meta: *meta }
  getV1AppContextJwks:
    tag: Apps
    summary: Read the app context verification keys
    description: "No authentication. The JSON Web Key Set that signs the context token an embedded app (iframe) receives from the panel. Verify the token's signature with the key whose `kid` matches; keys rotate, so cache the set briefly and refetch on an unknown `kid`. See the Build your own app guide."
    tr:
      summary: Uygulama bağlamı doğrulama anahtarlarını oku
      description: "Kimlik doğrulama gerekmez. Gömülü bir uygulamanın (iframe) panelden aldığı bağlam belirtecini imzalayan JSON Web Key Set. Belirtecin imzasını `kid` değeri eşleşen anahtarla doğrulayın; anahtarlar döner, kümeyi kısa süre önbelleğe alıp bilinmeyen `kid` görünce yeniden çekin. Bkz. Kendi uygulamanızı yapın kılavuzu."
    examples:
      responses:
        "200": { success: true, data: { keys: [{ kty: OKP, crv: Ed25519, kid: "2026-11-a", x: "11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo", use: sig, alg: EdDSA }] }, meta: *meta }

# Operations that exist in openapi.yaml under a generic path; the public spec
# shows the customer-facing variant. `from` must point at an existing operation.
derived:
  - from: { path: "/v1/webhooks/channels/{type}/{instance}", method: post }
    path: "/v1/webhooks/channels/api/{instance}"
    method: post
    operationId: receiveAPIChannelMessage
    tag: API channel
    summary: Send a customer message
    description: |
      Sends a customer message to the API channel. The channel is set up under **Channels → Add channel → API**; the setup gives you the inbound URL (`{instance}`), the signing secret and a field for the URL agent replies are sent to.

      The request is verified with the channel's signing secret, not an API key: `X-ClickFix-Timestamp` (Unix seconds) and `X-ClickFix-Signature: sha256=` + hex(HMAC-SHA256(secret, timestamp + "." + raw_body)). Requests whose timestamp is older than 5 minutes are rejected. A message with the same `id` is stored once. Retry on `5xx`.

      The answer carries `conversation_uuid` (the conversation the message joined) and `message_uuid`; a repeated `id` answers with the same conversation. Store `conversation_uuid` with your `thread_id`: agent replies and status changes (`status_changed`) refer to it as `conversation_id`.
    tr:
      summary: Müşteri mesajı gönder
      description: |
        API kanalına bir müşteri mesajı gönderir. Kanal **Kanallar → Kanal ekle → API** ile kurulur; kurulumda gelen adresi (`{instance}`), imza anahtarını ve temsilci yanıtlarının gönderileceği adresi alırsınız.

        İstek API anahtarıyla değil kanalın imza anahtarıyla doğrulanır: `X-ClickFix-Timestamp` (Unix saniye) ve `X-ClickFix-Signature: sha256=` + hex(HMAC-SHA256(imza_anahtarı, timestamp + "." + ham_gövde)). Zaman damgası 5 dakikadan eskiyse istek reddedilir. Aynı `id` ile gelen mesaj bir kez kaydedilir. `5xx` yanıtında tekrar deneyin.

        Yanıt, mesajın girdiği konuşmayı (`conversation_uuid`) ve `message_uuid` değerini taşır; tekrarlanan `id` aynı konuşmayla yanıtlanır. `conversation_uuid` değerini kendi `thread_id` değerinizle saklayın: temsilci yanıtları ve durum değişiklikleri (`status_changed`) ona `conversation_id` olarak başvurur.
    security: [{ apiChannelSignature: [] }]
    parameters:
      - name: instance
        in: path
        required: true
        description: The channel instance id given during setup.
        schema: { type: string }
      - name: X-ClickFix-Timestamp
        in: header
        required: true
        description: Signing time (Unix seconds).
        schema: { type: string }
        example: "1761732900"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIChannelMessage" }
          example:
            id: "msg-1001"
            sender_id: "customer-42"
            sender_name: "Ayşe Yılmaz"
            text: "When will my order arrive?"
    responses:
      "200":
        description: Message received.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvelopeWebhookReceived" }
            example: { success: true, data: { received: true, conversation_uuid: "8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f", message_uuid: "3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f" }, meta: { request_id: "01JCK9ZQ3M8R2W7X5E4T1N0PAB" } }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthenticated" }
      "404": { $ref: "#/components/responses/NotFound" }

webhooks:
  apiChannelReply:
    tag: API channel
    summary: Agent reply (API channel)
    description: |
      When an agent replies to a conversation on the API channel, ClickFix sends a `POST` with this body to the URL configured on the channel. The request carries `X-ClickFix-Timestamp`, `X-ClickFix-Signature` (the signing method above) and `Idempotency-Key` (the message UUID); process every key only once. Return `2xx` after the message is stored durably. Temporary failures are retried with increasing delays; `4xx` responses other than `408` and `429` count as permanent failures.
    tr:
      summary: Temsilci yanıtı (API kanalı)
      description: |
        Bir temsilci API kanalındaki konuşmayı yanıtladığında ClickFix, kanalda tanımladığınız adrese bu gövdeyle `POST` gönderir. İstek `X-ClickFix-Timestamp`, `X-ClickFix-Signature` (yukarıdaki imza yöntemi) ve `Idempotency-Key` (mesaj UUID'si) başlıklarını taşır; her anahtarı yalnızca bir kez işleyin. Mesajı kalıcı olarak kaydettikten sonra `2xx` dönün. Geçici hatalar artan aralıklarla tekrar denenir; `408` ve `429` dışındaki `4xx` yanıtları kalıcı hata sayılır.
    examples:
      request: { id: "3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f", conversation_id: "8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f", recipient_id: "customer-42", text: "Your order ships today.", thread_id: "msg-1001", reply_to: "msg-1001" }
  apiChannelStatusChanged:
    tag: API channel
    summary: Conversation status changed (API channel)
    description: |
      When an agent, a rule or a merge changes the status of a conversation on the API channel (resolved, closed, reopened, pending, snoozed), ClickFix sends a `POST` with this body to the URL configured on the channel. The request carries `X-ClickFix-Event: status_changed`, `X-ClickFix-Timestamp`, `X-ClickFix-Signature` (the signing method above) and `Idempotency-Key` (the event `id`, the same on every retry); process every key only once. `conversation_id` is the `conversation_uuid` from the message answer and `thread_id` is the thread you sent. Agent replies carry no `X-ClickFix-Event` header, so one endpoint can tell the two apart. Temporary failures are retried with increasing delays; `4xx` responses other than `408` and `429` count as permanent failures.
    tr:
      summary: Konuşma durumu değişti (API kanalı)
      description: |
        Bir temsilci, kural ya da birleştirme API kanalındaki bir konuşmanın durumunu değiştirdiğinde (çözüldü, kapandı, yeniden açıldı, beklemede, ertelendi) ClickFix, kanalda tanımladığınız adrese bu gövdeyle `POST` gönderir. İstek `X-ClickFix-Event: status_changed`, `X-ClickFix-Timestamp`, `X-ClickFix-Signature` (yukarıdaki imza yöntemi) ve `Idempotency-Key` (olay `id` değeri; her tekrarda aynıdır) başlıklarını taşır; her anahtarı yalnızca bir kez işleyin. `conversation_id`, mesaj yanıtındaki `conversation_uuid`; `thread_id` sizin gönderdiğiniz konudur. Temsilci yanıtlarında `X-ClickFix-Event` başlığı yoktur; tek uç nokta ikisini ayırabilir. Geçici hatalar artan aralıklarla tekrar denenir; `408` ve `429` dışındaki `4xx` yanıtları kalıcı hata sayılır.
    examples:
      request: { id: "9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a", type: status_changed, conversation_id: "8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f", thread_id: "order-991", from: open, to: resolved, changed_at: "2026-11-11T10:02:00Z" }

