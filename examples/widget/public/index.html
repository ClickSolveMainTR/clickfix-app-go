<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClickFix widget SDK örneği</title>
    <style>
      body { font: 15px system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 1fr 360px; min-height: 100vh; }
      main { padding: 24px 32px; } aside { background: #0f172a; color: #e2e8f0; padding: 16px; font: 12px ui-monospace, monospace; overflow: auto; max-height: 100vh; }
      section { margin-bottom: 20px; } h2 { font-size: 15px; margin: 0 0 8px; }
      button { margin: 0 6px 6px 0; padding: 7px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
      .support { background: #0f766e; color: #fff; border: 0; position: relative; }
      .support[data-clickfix-unread]:not([data-clickfix-unread="0"])::after { content: attr(data-clickfix-unread); position: absolute; top: -6px; right: -6px; background: #dc2626; border-radius: 9px; padding: 0 6px; font-size: 11px; }
      pre { margin: 0 0 6px; white-space: pre-wrap; }
      @media (max-width: 800px) { body { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body data-app="{{APP}}" data-widget-id="{{WIDGET}}" data-identity="{{IDENTITY}}">
    <main>
      <h1>ClickFix widget SDK</h1>
      <section>
        <h2>Açma / kapama</h2>
        <button class="support" data-clickfix-launcher data-clickfix-unread="0">Destek (kendi düğmem)</button>
        <button data-cmd="open">open()</button>
        <button data-cmd="open:messages">open("messages")</button>
        <button data-cmd="open:help">open("help")</button>
        <button data-cmd="close">close()</button>
        <button data-cmd="hideLauncher">hideLauncher()</button>
        <button data-cmd="showLauncher">showLauncher()</button>
        <button data-cmd="hide">hide()</button>
        <button data-cmd="show">show()</button>
      </section>
      <section>
        <h2>Konuşma</h2>
        <button data-cmd="prefill">startConversation("Siparişim…")</button>
        <button data-cmd="proactive">showMessage("…")</button>
        <button data-cmd="help">searchHelp("iade")</button>
      </section>
      <section>
        <h2>Kullanıcı</h2>
        <button data-cmd="identify">identify (sunucuda imzalı)</button>
        <button data-cmd="update">update({ name, plan })</button>
        <button data-cmd="attributes">setAttributes({ plan: "pro" })</button>
        <button data-cmd="track">track("checkout_started")</button>
        <button data-cmd="reset">reset() (çıkış)</button>
      </section>
      <section>
        <h2>Görünüm ve gizlilik</h2>
        <button data-cmd="locale:en">setLocale("en")</button>
        <button data-cmd="locale:tr">setLocale("tr")</button>
        <button data-cmd="theme:dark">setTheme("dark")</button>
        <button data-cmd="theme:light">setTheme("light")</button>
        <button data-cmd="consent">consent(true)</button>
        <button data-cmd="state">getState()</button>
        <button data-cmd="spa">pushState("/app/pricing")</button>
        <button data-cmd="shutdown">shutdown()</button>
      </section>
    </main>
    <aside id="log" aria-live="polite"></aside>
    <script>
      // Queue stub: calls before widget.js loads are replayed.
      window.ClickFix = window.ClickFix || function () { (window.ClickFix.q = window.ClickFix.q || []).push(arguments); };
      const cfg = document.body.dataset;
      const log = (name, data) => {
        const line = document.createElement("pre");
        line.textContent = `${new Date().toLocaleTimeString()} ${name} ${data === undefined ? "" : JSON.stringify(data)}`;
        document.getElementById("log").prepend(line);
      };
      ClickFix("boot", { widgetId: cfg.widgetId, debug: false });
      for (const e of ["ready", "open", "close", "view", "message", "message:sent", "unread", "conversation:started", "conversation:ended", "csat", "trigger", "attributes", "identify", "visibility", "consent", "error"])
        ClickFix("on", e, (p) => log(e, p));
      const user = { user_id: "demo-user-42", name: "Ada Yılmaz", email: "ada@example.com" };
      const actions = {
        open: () => ClickFix("open"),
        "open:messages": () => ClickFix("open", "messages"),
        "open:help": () => ClickFix("open", "help"),
        close: () => ClickFix("close"),
        hide: () => ClickFix("hide"),
        show: () => ClickFix("show"),
        hideLauncher: () => ClickFix("hideLauncher"),
        showLauncher: () => ClickFix("showLauncher"),
        prefill: () => ClickFix("startConversation", "Siparişim nerede? #10482"),
        proactive: () => ClickFix("showMessage", "Kargonuz yolda 🚚 Bir sorunuz var mı?"),
        help: () => ClickFix("searchHelp", "iade"),
        identify: async () => {
          if (cfg.identity !== "true") return log("identify", "CLICKFIX_IDENTITY_SECRET is not set");
          const res = await fetch("/user-hash", { method: "POST", body: JSON.stringify({ user_id: user.user_id }) });
          const { user_hash } = await res.json();
          await ClickFix("identify", { ...user, attributes: { plan: "pro" } }, user_hash);
        },
        update: () => ClickFix("update", { name: "Ada Y.", plan: "enterprise" }),
        attributes: () => ClickFix("setAttributes", { plan: "pro", seats: 12 }),
        track: () => ClickFix("track", "checkout_started", { total: 349.9 }),
        reset: () => ClickFix("reset"),
        "locale:en": () => ClickFix("setLocale", "en"),
        "locale:tr": () => ClickFix("setLocale", "tr"),
        "theme:dark": () => ClickFix("setTheme", "dark"),
        "theme:light": () => ClickFix("setTheme", "light"),
        consent: () => ClickFix("consent", true),
        state: () => log("state", ClickFix("getState")),
        spa: () => history.pushState({}, "", "/app/pricing"),
        shutdown: () => ClickFix("shutdown"),
      };
      document.addEventListener("click", (e) => {
        const cmd = e.target.closest("[data-cmd]")?.dataset.cmd;
        if (cmd) actions[cmd]?.();
      });
    </script>
    <script src="{{APP}}/widget.js" async></script>
  </body>
</html>
