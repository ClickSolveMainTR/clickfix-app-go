# Production stack (Dokploy compose or plain `docker compose`).
#
# Networks — every app gets its own:
#   app             Private bridge network created by Compose, named
#                   ${APP_NETWORK_NAME:-<NAME_PREFIX>-app}. All services join it.
#   dokploy-network Shared reverse-proxy network (external; Dokploy creates it,
#                   on a plain Docker host run once: docker network create dokploy-network).
#                   Only the public services join it: frontend and centrifugo.
#
# NAME_PREFIX is required: it makes container, volume and network names unique
# per app, so several boilerplate apps run side by side on one server.
# Internal hosts are always qualified as <service>.<app network>: a bare name
# like `backend` could resolve to another stack's container on dokploy-network.
name: ${COMPOSE_PROJECT_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod}

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-frontend-image: &frontend-image
  image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
  build:
    context: ./frontend
    dockerfile: Dockerfile

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-api}
  APP_ENV: production
  APP_HTTP_ADDR: :8080
  DB_HOST: postgres.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  REDIS_ADDR: redis.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  # SeaweedFS is private (app network only, no anonymous access): every object
  # reaches browsers through API stream endpoints, never a bucket URL.
  S3_ENDPOINT: http://seaweedfs.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_PATH_STYLE: "true"
  ATTACHMENT_MAX_FILE_BYTES: ${ATTACHMENT_MAX_FILE_BYTES:-26214400}
  ATTACHMENT_ORG_QUOTA_BYTES: ${ATTACHMENT_ORG_QUOTA_BYTES:-5368709120}
  ATTACHMENT_SIGNED_URL_TTL: ${ATTACHMENT_SIGNED_URL_TTL:-5m}
  CENTRIFUGO_API_URL: http://centrifugo.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:8000
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
  CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET is required}
  CENTRIFUGO_WS_URL: ${CENTRIFUGO_WS_URL:?CENTRIFUGO_WS_URL is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  AUTH_ADAPTER_SECRET: ${AUTH_ADAPTER_SECRET:?AUTH_ADAPTER_SECRET is required}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  # Public origin for links the API generates (e-mail links, step-up
  # origin). Defaults to AUTH_URL.
  PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-${AUTH_URL:?AUTH_URL is required}}
  # Passkey relying-party ID; empty → hostname of PUBLIC_FRONTEND_URL.
  AUTH_WEBAUTHN_RP_ID: ${AUTH_WEBAUTHN_RP_ID:-}
  MAIL_FROM: ${MAIL_FROM:-noreply@getclickfix.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ClickFix}
  MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  # starttls | implicit (465). SMTP_FALLBACK_PORT=465 retries over implicit
  # TLS when 587 is unreachable (egress blocked).
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
  SMTP_FALLBACK_PORT: ${SMTP_FALLBACK_PORT:-0}
  SMTP_DIAL_TIMEOUT: ${SMTP_DIAL_TIMEOUT:-10s}
  SMTP_SEND_TIMEOUT: ${SMTP_SEND_TIMEOUT:-30s}
  QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
  QUEUE_WORKER_INPROCESS: "false"
  QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-10}
  QUEUE_QUEUES: ${QUEUE_QUEUES:-}
  QUEUE_SCHEDULER_ENABLED: ${QUEUE_SCHEDULER_ENABLED:-true}
  QUEUE_SYNC_CONCURRENCY: ${QUEUE_SYNC_CONCURRENCY:-4}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:destek@getclickfix.com}
  SEARCH_ENABLED: ${SEARCH_ENABLED:-true}
  SEARCH_DRIVER: ${SEARCH_DRIVER:-meilisearch}
  MEILI_HOST: http://meilisearch.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
  MEILI_INDEX_PREFIX: ${MEILI_INDEX_PREFIX:-app}
  # --- Tenancy (organizations). ClickFix is always multi-tenant. ---
  TENANCY_ENABLED: ${TENANCY_ENABLED:-true}
  TENANCY_CACHE_TTL: ${TENANCY_CACHE_TTL:-60s}
  TENANCY_INVITE_TTL: ${TENANCY_INVITE_TTL:-168h}
  ONBOARDING_AI_CREDITS: ${ONBOARDING_AI_CREDITS:-40}
  # --- Channels (CF-55..CF-61). Meta channels stay off until app review. ---
  PUBLIC_API_URL: ${PUBLIC_API_URL:-}
  EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  RESEND_BASE_URL: ${RESEND_BASE_URL:-}
  META_CHANNELS_ENABLED: ${META_CHANNELS_ENABLED:-false}
  META_APP_ID: ${META_APP_ID:-}
  AUTH_ACCOUNT_DELETION_GRACE: ${AUTH_ACCOUNT_DELETION_GRACE:-168h}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
  META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID:-}
  META_INSTAGRAM_APP_ID: ${META_INSTAGRAM_APP_ID:-}
  META_INSTAGRAM_APP_SECRET: ${META_INSTAGRAM_APP_SECRET:-}
  META_RECONCILE_INTERVAL: ${META_RECONCILE_INTERVAL:-1m}
  META_RECONCILE_WINDOW: ${META_RECONCILE_WINDOW:-3h}
  TELEGRAM_CHANNEL_ENABLED: ${TELEGRAM_CHANNEL_ENABLED:-true}
  CHANNEL_HEALTH_INTERVAL: ${CHANNEL_HEALTH_INTERVAL:-15m}
  # --- Billing (CF-18..CF-42). Without the seller identity no invoice can be
  # issued, so trial checkout, havale/EFT and renewals all fail. ---
  BILLING_SELLER_JSON: ${BILLING_SELLER_JSON:-}
  BILLING_EINVOICE_PROVIDER: ${BILLING_EINVOICE_PROVIDER:-}
  BILLING_INVOICE_SERIES: ${BILLING_INVOICE_SERIES:-}
  BILLING_REFERRAL_CREDITS: ${BILLING_REFERRAL_CREDITS:-}
  # --- Payment providers (backend/internal/modules/billing/usecase/gateway_runtime.go) ---
  PAYMENTS_PAYTR_ENABLED: ${PAYMENTS_PAYTR_ENABLED:-}
  PAYMENTS_PAYTR_MODE: ${PAYMENTS_PAYTR_MODE:-}
  PAYMENTS_PAYTR_MERCHANT_ID: ${PAYMENTS_PAYTR_MERCHANT_ID:-}
  PAYMENTS_PAYTR_MERCHANT_KEY: ${PAYMENTS_PAYTR_MERCHANT_KEY:-}
  PAYMENTS_PAYTR_MERCHANT_SALT: ${PAYMENTS_PAYTR_MERCHANT_SALT:-}
  PAYMENTS_PAYTR_ACCOUNT_UUID: ${PAYMENTS_PAYTR_ACCOUNT_UUID:-}
  PAYMENTS_IYZICO_ENABLED: ${PAYMENTS_IYZICO_ENABLED:-}
  PAYMENTS_IYZICO_MODE: ${PAYMENTS_IYZICO_MODE:-}
  PAYMENTS_IYZICO_API_KEY: ${PAYMENTS_IYZICO_API_KEY:-}
  PAYMENTS_IYZICO_SECRET_KEY: ${PAYMENTS_IYZICO_SECRET_KEY:-}
  PAYMENTS_IYZICO_ACCOUNT_UUID: ${PAYMENTS_IYZICO_ACCOUNT_UUID:-}
  PAYMENTS_IYZICO_STATEMENTS_ENABLED: ${PAYMENTS_IYZICO_STATEMENTS_ENABLED:-}
  PAYMENTS_PAYTR_WEBHOOK_CIDRS: ${PAYMENTS_PAYTR_WEBHOOK_CIDRS:-}
  PAYMENTS_IYZICO_WEBHOOK_CIDRS: ${PAYMENTS_IYZICO_WEBHOOK_CIDRS:-}
  PAYMENTS_TRUSTED_PROXY_CIDRS: ${PAYMENTS_TRUSTED_PROXY_CIDRS:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # --- Mobile app (all optional; empty = feature off / defaults) ---
  AUTH_REVIEW_ACCOUNTS: ${AUTH_REVIEW_ACCOUNTS:-}
  AUTH_APPLE_NATIVE_CLIENT_IDS: ${AUTH_APPLE_NATIVE_CLIENT_IDS:-}
  AUTH_GOOGLE_NATIVE_CLIENT_IDS: ${AUTH_GOOGLE_NATIVE_CLIENT_IDS:-}
  # Sign in with Apple key fallback. Prefer uploading the .p8 in Platform →
  # Integrations → Apple (stored encrypted in the DB, wins over these).
  AUTH_APPLE_TEAM_ID: ${AUTH_APPLE_TEAM_ID:-}
  AUTH_APPLE_KEY_ID: ${AUTH_APPLE_KEY_ID:-}
  AUTH_APPLE_PRIVATE_KEY: ${AUTH_APPLE_PRIVATE_KEY:-}
  AUTH_QR_TRUST_GEO_HEADERS: ${AUTH_QR_TRUST_GEO_HEADERS:-false}
  AUTH_QR_GEOIP_DB: ${AUTH_QR_GEOIP_DB:-}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  # iOS Live Activity push (CF-152). Empty key = off.
  APNS_KEY_ID: ${APNS_KEY_ID:-}
  APNS_TEAM_ID: ${APNS_TEAM_ID:-}
  APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
  APNS_TOPIC: ${APNS_TOPIC:-com.getclickfix.app}
  # --- AI providers (backend/docs/ai/CORE-G3.md). Empty key = provider off. ---
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  AI_TRANSCRIBE_MODEL: ${AI_TRANSCRIBE_MODEL:-}
  AI_TRANSCRIBE_PRICE_MICROS: ${AI_TRANSCRIBE_PRICE_MICROS:-}
  AI_TRANSCRIBE_SUMMARY: ${AI_TRANSCRIBE_SUMMARY:-false}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
  AI_TRIAGE_PROVIDER: ${AI_TRIAGE_PROVIDER:-}
  AI_TRIAGE_MODEL: ${AI_TRIAGE_MODEL:-}
  AI_TRIAGE_INPUT_PRICE_MICROS: ${AI_TRIAGE_INPUT_PRICE_MICROS:-}
  AI_TRIAGE_OUTPUT_PRICE_MICROS: ${AI_TRIAGE_OUTPUT_PRICE_MICROS:-}
  AI_TRIAGE_CACHE_CREATE_PRICE_MICROS: ${AI_TRIAGE_CACHE_CREATE_PRICE_MICROS:-}
  AI_TRIAGE_CACHE_READ_PRICE_MICROS: ${AI_TRIAGE_CACHE_READ_PRICE_MICROS:-}
  AI_TRIAGE_FALLBACK_MODEL: ${AI_TRIAGE_FALLBACK_MODEL:-}
  AI_TRIAGE_FALLBACK_INPUT_PRICE_MICROS: ${AI_TRIAGE_FALLBACK_INPUT_PRICE_MICROS:-}
  AI_TRIAGE_FALLBACK_OUTPUT_PRICE_MICROS: ${AI_TRIAGE_FALLBACK_OUTPUT_PRICE_MICROS:-}
  AI_REPLY_PROVIDER: ${AI_REPLY_PROVIDER:-}
  AI_REPLY_MODEL: ${AI_REPLY_MODEL:-}
  AI_REPLY_INPUT_PRICE_MICROS: ${AI_REPLY_INPUT_PRICE_MICROS:-}
  AI_REPLY_OUTPUT_PRICE_MICROS: ${AI_REPLY_OUTPUT_PRICE_MICROS:-}
  AI_REPLY_CACHE_CREATE_PRICE_MICROS: ${AI_REPLY_CACHE_CREATE_PRICE_MICROS:-}
  AI_REPLY_CACHE_READ_PRICE_MICROS: ${AI_REPLY_CACHE_READ_PRICE_MICROS:-}
  AI_REPLY_FALLBACK_MODEL: ${AI_REPLY_FALLBACK_MODEL:-}
  AI_REPLY_FALLBACK_INPUT_PRICE_MICROS: ${AI_REPLY_FALLBACK_INPUT_PRICE_MICROS:-}
  AI_REPLY_FALLBACK_OUTPUT_PRICE_MICROS: ${AI_REPLY_FALLBACK_OUTPUT_PRICE_MICROS:-}
  AI_COMPLEX_PROVIDER: ${AI_COMPLEX_PROVIDER:-}
  AI_COMPLEX_MODEL: ${AI_COMPLEX_MODEL:-}
  AI_COMPLEX_INPUT_PRICE_MICROS: ${AI_COMPLEX_INPUT_PRICE_MICROS:-}
  AI_COMPLEX_OUTPUT_PRICE_MICROS: ${AI_COMPLEX_OUTPUT_PRICE_MICROS:-}
  AI_COMPLEX_CACHE_CREATE_PRICE_MICROS: ${AI_COMPLEX_CACHE_CREATE_PRICE_MICROS:-}
  AI_COMPLEX_CACHE_READ_PRICE_MICROS: ${AI_COMPLEX_CACHE_READ_PRICE_MICROS:-}
  AI_COMPLEX_FALLBACK_MODEL: ${AI_COMPLEX_FALLBACK_MODEL:-}
  AI_COMPLEX_FALLBACK_INPUT_PRICE_MICROS: ${AI_COMPLEX_FALLBACK_INPUT_PRICE_MICROS:-}
  AI_COMPLEX_FALLBACK_OUTPUT_PRICE_MICROS: ${AI_COMPLEX_FALLBACK_OUTPUT_PRICE_MICROS:-}
  AI_EMBEDDING_INPUT_PRICE_MICROS: ${AI_EMBEDDING_INPUT_PRICE_MICROS:-}
  # --- Error tracking (Sentry protocol, self-hosted). Empty DSN = off. ---
  # Dokploy env is shared by every service, so the backend DSN has its own name.
  SENTRY_DSN: ${BACKEND_SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  # Share of HTTP requests sent as performance transactions (0 = off).
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  # --- Tuning (empty = code default) ---
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-}
  STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-}
  BULK_SYNC_MAX: ${BULK_SYNC_MAX:-}
  BULK_ROLLBACK_HOURS: ${BULK_ROLLBACK_HOURS:-}
  CENTRIFUGO_ENABLED: ${CENTRIFUGO_ENABLED:-}
  CENTRIFUGO_TOKEN_TTL: ${CENTRIFUGO_TOKEN_TTL:-}
  # --- Slack channel app (docs/slack-teams-kurulum.md) ---
  SLACK_CHANNEL_CLIENT_ID: ${SLACK_CHANNEL_CLIENT_ID:-}
  SLACK_CHANNEL_CLIENT_SECRET: ${SLACK_CHANNEL_CLIENT_SECRET:-}
  SLACK_CHANNEL_SIGNING_SECRET: ${SLACK_CHANNEL_SIGNING_SECRET:-}
  SLACK_CHANNEL_REDIRECT_URL: ${SLACK_CHANNEL_REDIRECT_URL:-}
  # --- Organization IP policies: trusted reverse-proxy CIDRs (empty = ignore X-Forwarded-For) ---
  SSO_TRUSTED_PROXY_CIDRS: ${SSO_TRUSTED_PROXY_CIDRS:-}
  # --- Video rooms (CF-139, docs/video-rooms.md). Empty keys = module "not configured". ---
  # Public signalling URL browsers and phones dial (wss://, through Traefik).
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  # Server API on the private app network (never through the proxy).
  LIVEKIT_API_URL: http://livekit.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  # Platform recordings: SeaweedFS as the egress container reaches it.
  VIDEO_APPOINTMENT_OPEN_BEFORE_MINUTES: ${VIDEO_APPOINTMENT_OPEN_BEFORE_MINUTES:-10}
  VIDEO_APPOINTMENT_GRACE_MINUTES: ${VIDEO_APPOINTMENT_GRACE_MINUTES:-15}
  VIDEO_EGRESS_S3_ENDPOINT: http://seaweedfs.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:8333

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:8-alpine
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: ${NAME_PREFIX:-app}-seaweedfs
    restart: unless-stopped
    # Single-node SeaweedFS (master + volume + filer + S3 gateway). The bucket
    # is created on start. The admin identity from AWS_ACCESS_KEY_ID denies
    # anonymous S3 access; the JWT keys lock the filer / volume HTTP ports so
    # only the S3 gateway (same process) can read or write objects.
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -bucket=${S3_BUCKET:?S3_BUCKET is required}
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?SEAWEEDFS_JWT_WRITE_KEY is required}
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?SEAWEEDFS_JWT_WRITE_KEY is required}
      WEED_JWT_SIGNING_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?SEAWEEDFS_JWT_READ_KEY is required}
      WEED_JWT_FILER_SIGNING_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?SEAWEEDFS_JWT_READ_KEY is required}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Private: never attach SeaweedFS to dokploy-network or publish its ports.
    networks:
      - app

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # Use 127.0.0.1 — BusyBox wget resolves localhost to ::1; Meili listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-centrifugo
    restart: unless-stopped
    command: centrifugo -c config.json
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET is required}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:?CENTRIFUGO_ALLOWED_ORIGINS is required}
    volumes:
      - ./deploy/centrifugo/config.prod.json:/centrifugo/config.json:ro
    expose:
      - "8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "--address=http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app
      - dokploy-network

  # LiveKit SFU for video rooms (CF-139). Signalling (7880) is served through
  # Traefik as wss://<LIVEKIT_URL host> (Dokploy domain on service livekit,
  # port 7880, HTTPS on). Media does not go through the proxy: the RTC ports
  # below are published on the host and must be open in the firewall
  # (docs/video-rooms.md, "Ports"). Media is DTLS-SRTP encrypted; rooms are
  # additionally end-to-end encrypted unless recorded.
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-livekit
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/livekit/entrypoint.sh"]
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Shared Redis (same instance as the queue): multi-node routing and the
      # egress RPC bus. LiveKit keys never collide with asynq:* keys.
      REDIS_HOST: redis.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      LIVEKIT_WEBHOOK_URL: http://backend.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:8080/v1/public/video/webhook
      # Empty: discover the public IP via STUN. Set when the host is behind NAT.
      NODE_IP: ${LIVEKIT_NODE_IP:-}
      LIVEKIT_USE_EXTERNAL_IP: ${LIVEKIT_USE_EXTERNAL_IP:-true}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_RTC_TCP_PORT:-7881}
      LIVEKIT_RTC_PORT_START: ${LIVEKIT_RTC_PORT_START:-50000}
      LIVEKIT_RTC_PORT_END: ${LIVEKIT_RTC_PORT_END:-50100}
      # Embedded TURN (UDP 3478 + TURN/TLS 5349 behind a Traefik TCP router).
      # Empty = TURN off (clients behind strict firewalls may fail to connect).
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN:-}
      LIVEKIT_TURN_RELAY_START: ${LIVEKIT_TURN_RELAY_START:-50200}
      LIVEKIT_TURN_RELAY_END: ${LIVEKIT_TURN_RELAY_END:-50300}
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
      - ./deploy/livekit/entrypoint.sh:/etc/livekit/entrypoint.sh:ro
    expose:
      - "7880"
      - "5349"
    ports:
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-50100}:${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-50100}/udp"
      - "3478:3478/udp"
      - "${LIVEKIT_TURN_RELAY_START:-50200}-${LIVEKIT_TURN_RELAY_END:-50300}:${LIVEKIT_TURN_RELAY_START:-50200}-${LIVEKIT_TURN_RELAY_END:-50300}/udp"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Idles (no keys) count as healthy: video is optional.
      test: ["CMD-SHELL", "[ -z \"$$LIVEKIT_API_KEY\" ] || wget -q -O - http://127.0.0.1:7880 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app
      - dokploy-network

  # LiveKit Egress: server-side recordings (headless Chrome + GStreamer).
  # Uploads straight to the S3 target the API names per recording (the
  # organization's bucket or SeaweedFS). Needs ~2 CPU / 2-4 GB while recording.
  livekit-egress:
    image: livekit/egress:v1.15.0
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-livekit-egress
    restart: unless-stopped
    entrypoint:
      - /tini
      - --
      - /bin/sh
      - -c
      - 'if [ -z "$$LIVEKIT_API_KEY" ]; then echo "egress: LIVEKIT_API_KEY not set; recordings disabled"; exec sleep 2147483647; fi; exec /entrypoint.sh'
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_WS_URL: ws://livekit.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:7880
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:6379
          password: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        health_port: 9090
        logging:
          level: info
          json: true
        enable_chrome_sandbox: false
        session_limits:
          file_output_max_duration: 4h
    shm_size: 1gb
    mem_limit: ${LIVEKIT_EGRESS_MEM_LIMIT:-2g}
    depends_on:
      livekit:
        condition: service_started
    networks:
      - app

  migrate:
    <<: *backend-image
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-migrate
    environment:
      DATABASE_URL: postgres://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:5432/${DB_NAME:?DB_NAME is required}?sslmode=${DB_SSLMODE:-disable}
      APP_ROLE: migrate
      AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app

  backend:
    <<: *backend-image
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-backend
    environment:
      <<: *backend-environment
      APP_ROLE: server
      AUTO_MIGRATE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      # /healthz, not /readyz: a Postgres/Redis blip must not mark the API
      # unhealthy (unhealthy containers are dropped by the proxy).
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    # App network only: the frontend proxies /api, so the API needs no public
    # domain, and on dokploy-network its `backend` alias would answer other
    # stacks' lookups.
    networks:
      - app

  worker:
    <<: *backend-image
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-worker
    environment:
      <<: *backend-environment
      APP_ROLE: worker
      AUTO_MIGRATE: "false"
      QUEUE_QUEUES: ${QUEUE_QUEUES:-default:1,notifications:2,exports:2,imports:2,bulk:2,search:2,events:3,maintenance:1,messaging:3}
      QUEUE_SCHEDULER_ENABLED: ${QUEUE_SCHEDULER_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    stop_grace_period: 35s
    restart: unless-stopped
    networks:
      - app

  worker-sync:
    <<: *backend-image
    environment:
      <<: *backend-environment
      APP_ROLE: worker
      AUTO_MIGRATE: "false"
      QUEUE_QUEUES: sync
      QUEUE_CONCURRENCY: ${QUEUE_SYNC_CONCURRENCY:-4}
      QUEUE_SCHEDULER_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    mem_limit: 512m
    stop_grace_period: 35s
    restart: unless-stopped
    networks:
      - app

  frontend:
    <<: *frontend-image
    container_name: ${NAME_PREFIX:?NAME_PREFIX is required}-frontend
    environment:
      API_URL: http://backend.${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}:8080/v1
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_ADAPTER_SECRET: ${AUTH_ADAPTER_SECRET:-}
      NEXT_PUBLIC_BFF_BASE_URL: ${NEXT_PUBLIC_BFF_BASE_URL:-/api}
      NEXT_PUBLIC_REALTIME_ENABLED: ${NEXT_PUBLIC_REALTIME_ENABLED:-true}
      NEXT_PUBLIC_CENTRIFUGO_URL: ${NEXT_PUBLIC_CENTRIFUGO_URL:-}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
      NEXT_PUBLIC_FALLBACK_LOCALE: ${NEXT_PUBLIC_FALLBACK_LOCALE:-en}
      # Error tracking, read at runtime by the Next.js server/edge and served
      # to the browser by /api/client-env (no build arg). Empty = off.
      SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      # Real route is /health (not /api/v1/health). Unhealthy containers are
      # dropped by Traefik → domain returns "404 page not found".
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - app
      - dokploy-network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod-postgres}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod-redis}
  seaweedfs_data:
    name: ${SEAWEEDFS_VOLUME_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod-seaweedfs}
  meili_data:
    name: ${MEILI_VOLUME_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-prod-meilisearch}

networks:
  # Created by Compose for this app only.
  app:
    name: ${APP_NETWORK_NAME:-${NAME_PREFIX:?NAME_PREFIX is required}-app}
    driver: bridge
  dokploy-network:
    name: dokploy-network
    external: true
