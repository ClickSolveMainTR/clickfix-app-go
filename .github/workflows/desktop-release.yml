name: desktop-release

# Masaüstü uygulamalarının (CF-240) imzalı release derlemesi. Yalnız elle
# tetiklenir: macOS ve Windows runner dakikaları private repoda ücretlidir.
# Tasarım: docs/design/masaustu.md (8. bölüm). Prosedür ve gizli değerler:
# docs/security/masaustu-imzalama.md.
#
# - Sürüm desktop/VERSION'dan okunur; git etiketi basılmaz, repoya yazılmaz.
# - macOS: Developer ID Application, hardened runtime, sidecar dahil imza,
#   notarytool ile noter ve staple. Apple gizli değerleri yoksa paket
#   "imzasız iç test" olarak etiketlenir.
# - Windows: Authenticode adımı WINDOWS_SIGN_COMMAND gizli değeri varsa
#   çalışır (yöntem henüz seçilmedi: bulut HSM'li OV sertifika vb.). Yoksa
#   atlanır ve paket "imzasız iç test" olarak etiketlenir.
# - Tauri updater imzası zorunludur (TAURI_SIGNING_PRIVATE_KEY ve
#   TAURI_UPDATER_PUBKEY değişkeni). Yoksa iş akışı durur.
# - Çıktı Actions artefaktıdır (paketler, .sig, SHA256SUMS, manifest.json).
#   Yayınlama ayrı ve elle yapılır: desktop/scripts/publish-release.mjs.
#
# Workflow'da gizli değerlerin yalnız adları geçer; değerleri repoda yoktur.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Uygulama"
        type: choice
        options: [support, agent, both]
        default: support
      channel:
        description: "Kanal (beta için desktop/VERSION ön sürüm olmalı, ör. 0.2.0-beta.1)"
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.app }}-${{ inputs.channel }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.22.0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      apps: ${{ steps.version.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sürüm ve kanal
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          APP: ${{ inputs.app }}
        run: |
          version="$(tr -d '[:space:]' < desktop/VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::desktop/VERSION semver değil: $version"; exit 1
          fi
          case "$CHANNEL:$version" in
            stable:*-*) echo "::error::stable kanalında ön sürüm olmaz: $version"; exit 1 ;;
            beta:*-*) ;;
            beta:*) echo "::error::beta kanalı ön sürüm ister (ör. $version-beta.1)"; exit 1 ;;
          esac
          case "$APP" in
            both) apps='["support","agent"]' ;;
            *) apps="[\"$APP\"]" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Sürüm **$version**, kanal **$CHANNEL**, uygulama **$APP**" >> "$GITHUB_STEP_SUMMARY"
      - name: Updater anahtarı tanımlı mı
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_UPDATER_PUBKEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY (secret) ve TAURI_UPDATER_PUBKEY (variable) gerekli; docs/security/masaustu-imzalama.md"
            exit 1
          fi

  build:
    needs: prepare
    name: build (${{ matrix.app }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
        platform: [darwin-aarch64, darwin-x86_64, windows-x86_64]
        include:
          - platform: darwin-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          # Apple silicon runner Intel hedefini çapraz derler.
          - platform: darwin-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ matrix.app }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/sidecar/go.mod
          cache-dependency-path: desktop/sidecar/go.sum
      - name: Rust hedefi
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"
          rustc --version
      - name: Bağımlılıklar
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # --- macOS imzası: Developer ID Application, geçici anahtar zinciri ---
      - name: macOS sertifikası
        id: apple
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple imza/noter gizli değerleri eksik: $APP $PLATFORM imzasız iç test paketi olarak üretilecek"
            exit 0
          fi
          keychain="$RUNNER_TEMP/clickfix-signing.keychain-db"
          pass="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # notarytool App Store Connect API anahtarı (.p8) dosyadan okunur.
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey_$APPLE_API_KEY.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # --- Windows Authenticode: yöntem kullanıcı kararı (CF-240) ---
      # WINDOWS_SIGN_COMMAND, Tauri bundle.windows.signCommand biçiminde bir
      # komuttur (%1 imzalanacak dosya). Seçilen sağlayıcının aracı (ör.
      # bulut HSM istemcisi) ve kimlik bilgileri bu adıma eklenecek.
      # Gizli değer yoksa adım atlanır; paket imzasız iç test olur.
      - name: Windows Authenticode
        id: windows
        if: runner.os == 'Windows'
        env:
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          if [ -z "$WINDOWS_SIGN_COMMAND" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WINDOWS_SIGN_COMMAND yok: Authenticode atlandı, $APP $PLATFORM imzasız iç test paketi"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Derleme yapılandırması
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          WINDOWS_SIGNED: ${{ steps.windows.outputs.signed }}
          RELEASE_HOST: ${{ vars.DESKTOP_RELEASE_HOST || 'https://getclickfix.com' }}
        run: |
          # tauri.conf.json üzerine yazılan alanlar: updater açık anahtarı,
          # kanallı uç ve (varsa) Windows imza komutu.
          node -e '
            const [pubkey, host, app, channel, sign] = process.argv.slice(1);
            const conf = { plugins: { updater: { pubkey, endpoints: [
              `${host.replace(/\/+$/, "")}/api/v1/public/desktop/releases/${app}/{{target}}-{{arch}}/{{current_version}}?channel=${channel}`,
            ] } } };
            if (sign) conf.bundle = { windows: { signCommand: sign } };
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/tauri.release.json", JSON.stringify(conf));
          ' "$TAURI_UPDATER_PUBKEY" "$RELEASE_HOST" "$APP" "$CHANNEL" "$([ "$WINDOWS_SIGNED" = true ] && printf '%s' "$WINDOWS_SIGN_COMMAND")"

      - name: tauri build
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Boşsa Tauri imzalamaz ve noterlemez (imzasız iç test).
          APPLE_SIGNING_IDENTITY: ${{ steps.apple.outputs.signed == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ steps.apple.outputs.signed == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY: ${{ steps.apple.outputs.signed == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ steps.apple.outputs.signed == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          pnpm --filter "@clickfix-desktop/$APP" tauri build --ci \
            --target "$TARGET" --bundles "${{ matrix.bundles }}" \
            --config "$RUNNER_TEMP/tauri.release.json"

      # Tauri .app'i imzalar (sidecar dahil, hardened runtime), noterden
      # geçirir ve zımbalar. DMG ayrıca noterden geçirilip zımbalanır.
      - name: macOS noter (DMG) ve doğrulama
        if: runner.os == 'macOS' && steps.apple.outputs.signed == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bundle="desktop/target/$TARGET/release/bundle"
          app="$(ls -d "$bundle"/macos/*.app | head -1)"
          dmg="$(ls "$bundle"/dmg/*.dmg | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Sidecar ayrı imzalı ve hardened runtime bayraklı olmalı.
          sidecar="$app/Contents/MacOS/clickfix-sidecar"
          codesign --verify --strict --verbose=2 "$sidecar"
          codesign -dvv "$sidecar" 2>&1 | grep -q 'flags=.*runtime' || { echo "::error::sidecar hardened runtime değil"; exit 1; }
          codesign -dvv "$app" 2>&1 | grep -q 'flags=.*runtime' || { echo "::error::uygulama hardened runtime değil"; exit 1; }
          xcrun stapler validate "$app"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Windows imza doğrulaması
        if: runner.os == 'Windows' && steps.windows.outputs.signed == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem "desktop/target/$env:TARGET/release/bundle/nsis/*.exe"
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            if ($s.Status -ne 'Valid') { throw "Authenticode geçersiz: $($f.Name) $($s.Status)" }
          }

      - name: Paketleri topla
        id: collect
        env:
          MAC_SIGNED: ${{ steps.apple.outputs.signed }}
          WIN_SIGNED: ${{ steps.windows.outputs.signed }}
        run: |
          bundle="desktop/target/$TARGET/release/bundle"
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          if [ "$RUNNER_OS" = macOS ]; then
            signed="${MAC_SIGNED:-false}"
            updater="$(ls "$bundle"/macos/*.app.tar.gz | head -1)"
            installer="$(ls "$bundle"/dmg/*.dmg | head -1)"
          else
            signed="${WIN_SIGNED:-false}"
            updater="$(ls "$bundle"/nsis/*-setup.exe | head -1)"
            installer=""
          fi
          [ -f "$updater.sig" ] || { echo "::error::updater imzası (.sig) yok: $updater"; exit 1; }
          # Ürün adları boşluk ve Türkçe harf içerir; API dosya adı kuralına
          # (ASCII, boşluksuz) uyan sabit adlar verilir. .sig içeriği ada bağlı değildir.
          base="clickfix-${APP}_${VERSION}_${PLATFORM}"
          case "$updater" in
            *.app.tar.gz) up_name="$base.app.tar.gz" ;;
            *) up_name="$base-setup.exe" ;;
          esac
          cp "$updater" "$out/$up_name"
          cp "$updater.sig" "$out/$up_name.sig"
          inst_name=""
          if [ -n "$installer" ]; then inst_name="$base.dmg"; cp "$installer" "$out/$inst_name"; fi
          node -e '
            const fs = require("fs");
            const [out, app, channel, version, target, signed, updater, installer] = process.argv.slice(1);
            const manifest = { app, channel, version, target, os_signed: signed === "true",
              label: signed === "true" ? "imzalı" : "imzasız iç test",
              updater, installer: installer || null,
              signature: fs.readFileSync(`${out}/${updater}.sig`, "utf8").trim() };
            fs.writeFileSync(`${out}/manifest.json`, JSON.stringify(manifest, null, 2) + "\n");
          ' "$out" "$APP" "$CHANNEL" "$VERSION" "$PLATFORM" "$signed" "$up_name" "$inst_name"
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd "$out" && $sum "$up_name" ${inst_name:+"$inst_name"} > SHA256SUMS)
          cat "$out/SHA256SUMS"
          suffix=""; [ "$signed" = true ] || suffix="-imzasiz-ic-test"
          echo "name=clickfix-$APP-$VERSION-$CHANNEL-$PLATFORM$suffix" >> "$GITHUB_OUTPUT"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          if [ "$signed" = true ]; then
            echo "- $APP $PLATFORM: imzalı" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- $APP $PLATFORM: **imzasız iç test** (müşteriye dağıtılmaz)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.collect.outputs.name }}
          path: ${{ steps.collect.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Anahtar zincirini sil
        if: always() && runner.os == 'macOS' && steps.apple.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.apple.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/apple"
