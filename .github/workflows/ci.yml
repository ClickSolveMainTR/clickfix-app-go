name: ci

# Adapted from olexfilms-ecosystem's ci.yml: one path-filtered run per PR and
# per main push, a single required "ci" check, v0.N release tags on green
# main, and EAS shipping for mobile/ (OTA when the native fingerprint is
# unchanged, a TestFlight build otherwise).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly full run (every job, whatever changed) so the image build stays
  # proven even when no merge touched its inputs.
  schedule:
    - cron: "0 3 * * 1"

# One run per PR, and one per main push stream: a newer push to main cancels
# the older main run. The surviving run diffs from the last v0.N tag, so
# areas changed in cancelled runs are still tested and mobile/ changes still
# shipped. mobile-release and release-tag use !failure() so a cancel never
# kills an EAS build or a tag push half-way.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

# Runner: every job runs on the org's self-hosted runners (labels
# self-hosted + clickfix) by default. To go back to GitHub-hosted runners
# without a code change, set the repository variable CI_RUNNER to the JSON
# string "ubuntu-24.04" (quotes included); delete the variable to return to
# self-hosted. The self-hosted machine is persistent and runs several jobs
# at once, so jobs must not rely on fixed host ports, fixed container names
# or shared /tmp paths.
env:
  GOLANGCI_LINT_VERSION: v2.14.0
  SQLC_VERSION: "1.31.1"
  MIGRATE_VERSION: v4.19.1

jobs:
  # Decides which jobs a run needs (plain git diff, no third-party action).
  # PRs diff against their base; a push to main diffs against the newest
  # v0.N tag before HEAD (no tag -> full). workflow_dispatch, the weekly
  # schedule, a PR labelled "ci-full" and a change to this file run all.
  #   frontend/**                 -> frontend, contracts
  #   backend/**                  -> backend, contracts
  #   backend/migrations/**       -> backend, contracts, infra
  #   mobile/**                   -> mobile
  #   sdks/php/**, sdks/examples/** -> backend, contracts, php (sdks/php/** also laravel)
  #   sdks/laravel/**             -> backend, contracts, laravel
  #   backend/docs/openapi.yaml   -> backend, frontend, contracts, mobile, php
  #   Dockerfiles, compose.prod.yml, deploy/** -> image-build
  #   docs/**, *.md, .github/**   -> nothing (ci.yml itself -> everything)
  #   Makefile, scripts/, other   -> backend, frontend, contracts
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      mobile: ${{ steps.filter.outputs.mobile }}
      php: ${{ steps.filter.outputs.php }}
      infra: ${{ steps.filter.outputs.infra }}
      laravel: ${{ steps.filter.outputs.laravel }}
      flutter: ${{ steps.filter.outputs.flutter }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      # Self-hosted only: a container job that ran as root (php) can leave
      # root-owned files in a runner's workspace, and every later checkout on
      # that runner then fails with EACCES. Hand the workspaces of all runners
      # on this machine back to the runner user before the first checkout.
      - name: Repair workspace ownership (self-hosted)
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          command -v docker >/dev/null || { echo "no docker; skipped"; exit 0; }
          root=$(dirname "$(dirname "$(dirname "$RUNNER_WORKSPACE")")")
          repo=$(basename "$RUNNER_WORKSPACE")
          docker run --rm -v "$root:/r" alpine:3 sh -c "for d in /r/*/_work/$repo; do [ -d \"\$d\" ] && chown -R $(id -u):$(id -g) \"\$d\"; done; true"
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          filter: blob:none
      - name: Changed areas
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: |
          backend=false; frontend=false; contracts=false
          mobile=false; php=false; infra=false; laravel=false; flutter=false; full=false
          files=""
          case "$EVENT" in
            pull_request)
              [ "$CI_FULL" = "true" ] && full=true || files=$(git diff --name-only HEAD^1 HEAD) ;;
            push)
              if base=$(git describe --tags --abbrev=0 --match 'v0.[0-9]*' HEAD^ 2>/dev/null); then
                echo "diff base: $base ($(git rev-parse --short "$base^{commit}"))"
                files=$(git diff --name-only "$base" HEAD)
              else
                full=true
              fi ;;
            *) full=true ;;
          esac
          printf '%s\n' "$files"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/ci.yml) full=true ;;
              .github/*) ;;
              backend/docs/openapi.yaml)
                backend=true; frontend=true; contracts=true; mobile=true; php=true ;;
              *.md|docs/*) ;;
              backend/Dockerfile|frontend/Dockerfile|compose.prod.yml|deploy/*|.dockerignore|*/.dockerignore)
                infra=true ;;
              backend/migrations/*) backend=true; contracts=true; infra=true ;;
              frontend/*) frontend=true; contracts=true ;;
              mobile/*) mobile=true ;;
              sdks/php/*) backend=true; contracts=true; php=true; laravel=true ;;
              sdks/examples/*) backend=true; contracts=true; php=true ;;
              sdks/laravel/*) backend=true; contracts=true; laravel=true ;;
              sdks/flutter/*) flutter=true ;;
              backend/*|sdks/*) backend=true; contracts=true ;;
              *) backend=true; frontend=true; contracts=true ;;
            esac
          done <<< "$files"
          if [ "$full" = "true" ]; then
            backend=true; frontend=true; contracts=true; mobile=true; php=true; infra=true; laravel=true; flutter=true
          fi
          {
            echo "backend=$backend"; echo "frontend=$frontend"
            echo "contracts=$contracts"; echo "mobile=$mobile"
            echo "php=$php"; echo "infra=$infra"; echo "laravel=$laravel"; echo "flutter=$flutter"; echo "full=$full"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        # Host port is picked by Docker so parallel runs on one machine do not collide.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Integration tests skip when these are unset; here they always run
      # against the migrated service database, on the ports Docker assigned.
      - name: Service addresses
        working-directory: .
        env:
          CI_PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          CI_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          {
            echo "CI_PG_PORT=$CI_PG_PORT"
            echo "CI_REDIS_PORT=$CI_REDIS_PORT"
            echo "TEST_DATABASE_URL=postgres://app:app@localhost:$CI_PG_PORT/app_test?sslmode=disable"
            echo "TEST_REDIS_URL=redis://localhost:$CI_REDIS_PORT/0"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          # The self-hosted machine keeps its module cache; restoring over it fails on read-only files.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      - name: sqlc generate is up to date
        run: |
          sqlc generate
          git diff --exit-code -- internal/database/db
      # Several self-hosted runners share one machine and one home directory.
      # The action's cache restore and golangci-lint's default cache directory
      # (~/.cache/golangci-lint) then collide between parallel jobs, which
      # failed a run on the cache lock. Each runner gets its own directory,
      # named after the runner (runners installed with a shared --work
      # directory would otherwise still collide), kept between runs, and
      # skips the action cache.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.environment != 'github-hosted' && format('{0}/../golangci-lint-cache-{1}', runner.temp, runner.name) || '' }}
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
          skip-cache: ${{ runner.environment != 'github-hosted' }}
      - name: go vet
        run: go vet ./...
      - name: Migrate test database
        run: go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}" -path migrations -database "$TEST_DATABASE_URL" up
      # Down files of the newest migrations must undo them cleanly: roll the
      # last two back and apply them again (up -> down -> up).
      - name: Migration roundtrip (last two)
        run: |
          go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}" -path migrations -database "$TEST_DATABASE_URL" down 2
          go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}" -path migrations -database "$TEST_DATABASE_URL" up
      - name: go test
        run: go test ./... -count=1
      # The API registers every module's routes at startup; overlapping
      # patterns make net/http panic there, which no unit test catches.
      # Boot the real server against the migrated test database and require
      # it to answer HTTP before stopping it.
      - name: Server boot smoke test
        run: |
          # Startup pings object storage; run the same SeaweedFS image as compose.
          # Container name, ports and temp files are unique to this run.
          s3="seaweedfs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$s3" -p 127.0.0.1::8333 \
            -e AWS_ACCESS_KEY_ID=s3admin -e AWS_SECRET_ACCESS_KEY=s3admin-secret \
            chrislusf/seaweedfs:4.47 mini -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -bucket=app \
            -s3.port=8333 -s3.port.iceberg=0 -s3.port.lance=0 -webdav=false -admin.ui=false -master.telemetry=false
          s3_port=$(docker port "$s3" 8333/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$s3_port/healthz" >/dev/null 2>&1 && break; sleep 1; done
          api_port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1])')
          # .env.example sets its own ports; the assigned ones are exported after it.
          set -a; . ../.env.example 2>/dev/null || true; set +a
          export BILLING_SELLER_JSON="$(grep '^BILLING_SELLER_JSON=' ../.env.example | cut -d= -f2-)"
          export DB_HOST=localhost DB_PORT="$CI_PG_PORT" DB_USER=app DB_PASSWORD=app DB_NAME=app_test
          export REDIS_ADDR="localhost:$CI_REDIS_PORT" APP_HTTP_ADDR="127.0.0.1:$api_port"
          export S3_ENDPOINT="http://127.0.0.1:$s3_port" S3_PORT="$s3_port"
          go build -o "$RUNNER_TEMP/api" ./cmd/server
          "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then echo "server exited during startup"; cat "$RUNNER_TEMP/api.log"; exit 1; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$api_port/" || true)
            if [ "$code" != "000" ]; then echo "server answered HTTP $code"; kill "$pid"; exit 0; fi
            sleep 1
          done
          echo "server did not answer within 60s"; cat "$RUNNER_TEMP/api.log"; kill "$pid"; exit 1
      # A hosted runner is thrown away; a self-hosted one keeps the container.
      - name: Remove smoke test storage
        if: always()
        run: docker rm -f "seaweedfs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml docs/public-api.yaml
      - name: compose.prod.yml passes every backend env var
        working-directory: .
        run: ./scripts/check-compose-env.sh

  # Part of the required `ci` gate: no high-severity gosec findings, no reachable Go
  # vulnerabilities, no high/critical production npm advisories.
  security:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          # The self-hosted machine keeps its module cache; restoring over it fails on read-only files.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Reachable Go vulnerabilities (all severities)
        run: python3 scripts/govulncheck.py backend backend/.govulncheck-ignore
      - name: Go security analysis (high severity)
        working-directory: backend
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.11 -severity high -exclude-generated ./...
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          standalone: true
          # Default is under $HOME, which the runners on one machine share.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: SDK Go vulnerabilities
        working-directory: sdks/go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: SDK Go security analysis (high severity)
        working-directory: sdks/go
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.11 -severity high -exclude-generated ./...
      - name: SDK dependency audit
        working-directory: sdks
        run: pnpm audit --audit-level high
      - name: Production dependency audit (high and critical)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

  # Keep generator downloads/builds out of the fast contracts job.
  sdks:
    needs: [changes]
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: sdks/go/go.sum
          # The self-hosted machine keeps its module cache; restoring over it fails on read-only files.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          standalone: true
          # Default is under $HOME, which the runners on one machine share.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: sdks/pnpm-lock.yaml
      - name: Install SDK tools
        working-directory: sdks
        run: pnpm install --frozen-lockfile
      - name: Generated SDKs and backend/docs/public-api.yaml are current
        working-directory: sdks
        run: pnpm check
      - name: TypeScript and widget SDK tests
        working-directory: sdks
        run: pnpm test
      - name: Go SDK tests
        working-directory: sdks/go
        run: go test -p 2 ./...
      # Integration guide samples (CF-199): the code embedded in the guide
      # pages is this code, type-checked, compiled and run against the stub API.
      - name: Guide examples are embedded and run
        working-directory: sdks
        run: |
          pnpm examples:check
          pnpm examples
      # What `sdk-publish` would ship from main: publish dry run, no token
      # needed. pnpm (not npm) so `workspace:` dependencies are rewritten to
      # real versions (react-widget depends on visitor-core, CF-201).
      - name: npm publish dry run
        working-directory: sdks
        run: |
          for p in node visitor-core react-widget; do
            (cd "$p" && pnpm publish --dry-run --no-git-checks --access public)
          done
          echo "sdks/go version $(cat go/VERSION) -> mirror tag go/v$(cat go/VERSION)"

  # Laravel package (CF-205): the Testbench suite on every supported Laravel x PHP
  # pair. clickfix/laravel depends on clickfix/sdk through a Composer path
  # repository (../php), so the checkout is enough; nothing is fetched from
  # Packagist for the SDK itself.
  laravel:
    needs: [changes]
    if: needs.changes.outputs.laravel == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    name: laravel ${{ matrix.laravel }} php ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: "10.*", testbench: "8.*", php: "8.1" }
          - { laravel: "10.*", testbench: "8.*", php: "8.2" }
          - { laravel: "10.*", testbench: "8.*", php: "8.3" }
          - { laravel: "11.*", testbench: "9.*", php: "8.2" }
          - { laravel: "11.*", testbench: "9.*", php: "8.3" }
          - { laravel: "11.*", testbench: "9.*", php: "8.4" }
          - { laravel: "12.*", testbench: "10.*", php: "8.2" }
          - { laravel: "12.*", testbench: "10.*", php: "8.3" }
          - { laravel: "12.*", testbench: "10.*", php: "8.4" }
          - { laravel: "13.*", testbench: "11.*", php: "8.3" }
          - { laravel: "13.*", testbench: "11.*", php: "8.4" }
    # Runs inside the official PHP image so the matrix does not depend on the self-hosted
    # machine's PHP or package manager (shivammathur/setup-php hung there in its apt/sudo step).
    container:
      image: php:${{ matrix.php }}-cli
    env:
      COMPOSER_NO_INTERACTION: "1"
      COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      # Repair up front too: a root-owned leftover from an earlier container job on this
      # runner slot would otherwise make actions/checkout fail with EACCES (same pattern as
      # the php job of CF-204).
      - name: Workspace ownership (before checkout)
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE" 2>/dev/null || true
      - uses: actions/checkout@v7
      - name: Install git, unzip and Composer
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip ca-certificates >/dev/null
          php -r "copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');"
          php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
          php -v | head -1; composer --version
      - name: Validate composer.json
        working-directory: sdks/laravel
        run: composer validate --strict --no-check-lock
      - name: Install Laravel ${{ matrix.laravel }} with Testbench ${{ matrix.testbench }}
        working-directory: sdks/laravel
        run: |
          composer update --prefer-dist --no-progress \
            --with="laravel/framework:${{ matrix.laravel }}" \
            --with="orchestra/testbench:${{ matrix.testbench }}"
          composer show laravel/framework orchestra/testbench phpunit/phpunit | grep -E '^(name|versions)'
      - name: Tests
        working-directory: sdks/laravel
        run: vendor/bin/phpunit --no-coverage
      # The container runs as root on the runner's bind-mounted workspace. Hand every file back
      # to the runner user (owner of the workspace's parent directory), otherwise the next job on
      # this runner slot fails in actions/checkout with EACCES while cleaning the workspace.
      - name: Return workspace ownership to the runner user
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"

  # PHP SDK (CF-204): sdks/php (clickfix/sdk) on every supported PHP version:
  # composer validate and package name, php-cs-fixer, PHPStan level 8, PHPUnit,
  # then the guide's PHP examples against the stub API (the sdks job also runs
  # them when the runner has php; here they are required). The version is the
  # newest `## X.Y.Z` heading of sdks/php/CHANGELOG.md and Client::USER_AGENT;
  # the sdks-mirror job pushes sdks/php to ClickSolveMainTR/clickfix-php and
  # tags vX.Y.Z there, which Packagist (clickfix/sdk) watches.
  # Runs in the official php:<version>-cli image: the self-hosted runners have
  # no PHP and setup-php's apt/sudo install hangs there, while the container
  # already has the interpreter; Composer comes from the signed installer.
  php:
    needs: [changes]
    if: needs.changes.outputs.php == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    container:
      image: php:${{ matrix.php }}-cli
    env:
      COMPOSER_ALLOW_SUPERUSER: '1'
      COMPOSER_NO_INTERACTION: '1'
    steps:
      # The container runs as root on a workspace the runner user owns: hand
      # back anything root left behind (vendor/, caches, node tool cache) at
      # the end, and repair it up front, or the next checkout on this runner
      # fails with EACCES.
      - name: Workspace ownership (before checkout)
        run: |
          owner=$(stat -c %u:%g "$GITHUB_WORKSPACE")
          echo "workspace owner $owner"
          chown -R "$owner" "$GITHUB_WORKSPACE" 2>/dev/null || true
      - name: Tools (git, unzip, jq, Composer)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git unzip jq ca-certificates curl >/dev/null
          expected=$(curl -fsS https://composer.github.io/installer.sig)
          php -r "copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');"
          actual=$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")
          [ "$expected" = "$actual" ] || { echo "::error::Composer installer checksum mismatch"; exit 1; }
          php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
          rm /tmp/composer-setup.php
          php --version | head -1; composer --version
      - uses: actions/checkout@v7
      - name: Package metadata (composer validate, name, license, version)
        working-directory: sdks/php
        run: |
          composer validate --strict --no-check-lock
          [ "$(jq -r .name composer.json)" = "clickfix/sdk" ] || { echo "::error::composer.json name must be clickfix/sdk"; exit 1; }
          [ "$(jq -r .license composer.json)" = "MIT" ] && [ -s LICENSE ] || { echo "::error::MIT license missing"; exit 1; }
          version=$(sed -n 's/^## \([0-9][0-9.]*\) - .*/\1/p' CHANGELOG.md | head -1)
          [ -n "$version" ] || { echo "::error::CHANGELOG.md has no '## X.Y.Z - date' entry"; exit 1; }
          grep -q "'clickfix-php-sdk/$version'" src/Client.php || { echo "::error::Client::USER_AGENT must carry version $version"; exit 1; }
          echo "clickfix/sdk $version -> clickfix-php tag v$version"
      # GitHub dist downloads count against the API rate limit; the job token lifts it.
      - name: Install
        working-directory: sdks/php
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-progress --prefer-dist
      - name: Code style (php-cs-fixer)
        working-directory: sdks/php
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'
        run: composer cs
      - name: Static analysis (PHPStan level 8)
        working-directory: sdks/php
        run: composer stan
      - name: Unit tests (PHPUnit)
        working-directory: sdks/php
        run: composer test
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Guide PHP examples against the stub API
        working-directory: sdks
        env:
          CLICKFIX_EXAMPLES_PHP: required
        run: |
          node examples/run.mjs --check --only=php
          node examples/run.mjs --only=php
      - name: Workspace ownership (after)
        if: always()
        run: |
          owner=$(stat -c %u:%g "$GITHUB_WORKSPACE")
          rm -rf sdks/php/vendor sdks/php/composer.lock sdks/php/.phpunit.cache sdks/php/.php-cs-fixer.cache sdks/examples/php/vendor
          chown -R "$owner" "$GITHUB_WORKSPACE" || true
          [ -d "$RUNNER_TOOL_CACHE" ] && chown -R "$owner" "$RUNNER_TOOL_CACHE" || true

  # Flutter webview package (CF-203, sdks/flutter/clickfix_webview): analyzer,
  # formatter, unit + widget tests, the example app compiled to a Flutter
  # bundle (no Android SDK / Xcode needed) and the pub.dev publish dry run.
  # The toolchain is installed by subosito/flutter-action (the self-hosted
  # runners have no Flutter); the version is pinned to what the package was
  # developed with. The dry run needs a LICENSE file in the package root:
  # while it is missing the step warns and skips instead of failing.
  flutter:
    needs: [changes]
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    env:
      FLUTTER_PKG: sdks/flutter/clickfix_webview
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Dependencies
        working-directory: ${{ env.FLUTTER_PKG }}
        run: flutter pub get
      - name: Analyze and format
        working-directory: ${{ env.FLUTTER_PKG }}
        run: |
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
      - name: Tests
        working-directory: ${{ env.FLUTTER_PKG }}
        run: flutter test
      - name: Example app compiles
        working-directory: ${{ env.FLUTTER_PKG }}/example
        run: |
          flutter pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          flutter build bundle
      # What `sdk-publish` would ship from main; no credentials needed.
      - name: pub.dev publish dry run
        working-directory: ${{ env.FLUTTER_PKG }}
        run: |
          if [ ! -f LICENSE ]; then
            echo "::warning::$FLUTTER_PKG/LICENSE is missing: pub.dev dry run skipped (pub refuses packages without a license)"
            echo "pub.dev dry run skipped: $FLUTTER_PKG/LICENSE is missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dart pub publish --dry-run
          echo "clickfix_webview $(sed -n 's/^version: *//p' pubspec.yaml) -> pub.dev" >> "$GITHUB_STEP_SUMMARY"

  # Lint, format, types, unit tests and the production build.
  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          standalone: true
          # Default is under $HOME, which the runners on one machine share.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm run --if-present test
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          # The Turbopack cache stores absolute paths, so it is only valid for
          # the checkout location that wrote it: one cache for hosted runners,
          # one per self-hosted runner.
          key: next-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.environment == 'github-hosted' && 'hosted' || runner.name }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build

  # Expo app: lint, typecheck, tests and the committed API types. No native
  # build here. Skips cleanly until mobile/ exists (CF-79).
  mobile:
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: mobile/ present?
        id: present
        run: |
          if [ -f mobile/package.json ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "mobile/ does not exist yet" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-node@v7
        if: steps.present.outputs.run == 'true'
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        if: steps.present.outputs.run == 'true'
        working-directory: mobile
        run: npm ci
      - name: Lint, typecheck, tests, i18n
        if: steps.present.outputs.run == 'true'
        working-directory: mobile
        run: |
          npm run --if-present lint
          npm run --if-present typecheck
          npm run --if-present test
          npm run --if-present i18n:check
      - name: api-generate is up to date
        if: steps.present.outputs.run == 'true'
        working-directory: mobile
        run: |
          if npm run | grep -q 'api:generate'; then
            npm run api:generate
            git diff --exit-code -- src
          fi

  # Generated contracts must be committed: frontend API types and i18n
  # catalogs in parity.
  contracts:
    needs: [changes]
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          standalone: true
          # Default is under $HOME, which the runners on one machine share.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # After setup-node: the self-hosted machine has no preinstalled Node.
      - name: Check frontend public API docs copy
        run: node frontend/scripts/sync-docs-spec.mjs --check
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: api-generate is up to date
        working-directory: frontend
        run: |
          pnpm api:generate
          git diff --exit-code -- src/generated/
      - name: i18n
        run: node scripts/check-i18n.mjs

  # Builds the production images as Dokploy does (compose.prod.yml contexts),
  # without pushing. Only when Dockerfiles, compose or deploy/ change, on a
  # full run and weekly.
  image-build:
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Exposes the runtime token the type=gha cache needs to the docker CLI.
      - name: compose.prod.yml passes every backend env var
        run: ./scripts/check-compose-env.sh
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Build backend and frontend images
        run: |
          for svc in backend frontend; do
            docker buildx build "./$svc" \
              --cache-from "type=gha,scope=$svc" \
              --cache-to "type=gha,scope=$svc,mode=max"
          done

  # Single required status check. Branch protection waits on "ci"; it fails
  # when any job above failed or was cancelled. Skipped jobs count as passed;
  # the filter itself must succeed.
  ci:
    name: ci
    if: always()
    needs: [changes, backend, frontend, mobile, contracts, image-build, security, sdks, php, laravel, flutter]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::path filter job did not succeed"; exit 1
          fi
          if ! echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::a required CI job failed or was cancelled"; exit 1
          fi

  # Every green push to main that touched mobile/ (or the OpenAPI spec) ships
  # the app: same native fingerprint as the latest store build -> eas update
  # (OTA, channel production); fingerprint changed or no build yet -> eas
  # build --auto-submit (TestFlight). Skips (green, with a summary note)
  # until mobile/ exists, the EXPO_TOKEN secret is set and app.json has an
  # EAS project id (`eas init`), so a missing credential never fails main.
  mobile-release:
    needs: [ci]
    if: ${{ !failure() && needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    defaults:
      run:
        working-directory: .
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ !failure() }}
        with:
          fetch-depth: 0
          filter: blob:none
      - name: mobile/ changed since the last release?
        if: ${{ !failure() }}
        id: changed
        run: |
          if [ ! -f mobile/package.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "mobile/ does not exist yet" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ -z "$EXPO_TOKEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN secret is not set: mobile release skipped (mobile/README.md, Release)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if ! jq -e '.expo.extra.eas.projectId // empty' mobile/app.json >/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mobile/app.json has no extra.eas.projectId (run eas init): mobile release skipped" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if base=$(git describe --tags --abbrev=0 --match 'v0.[0-9]*' HEAD^ 2>/dev/null); then
            echo "diff base: $base"
            files=$(git diff --name-only "$base" HEAD -- mobile backend/docs/openapi.yaml | grep -vE '\.md$' || true)
          else
            files="(unknown range, shipping)"
          fi
          if [ -n "$files" ]; then
            printf '%s\n' "$files"; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mobile/ unchanged, nothing shipped" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: ${{ !failure() && steps.changed.outputs.run == 'true' }}
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        if: ${{ !failure() && steps.changed.outputs.run == 'true' }}
        working-directory: mobile
        run: npm ci
      # Checked per platform: a platform with no finished store build yet, or
      # whose native fingerprint changed, gets a build; the other gets an OTA update.
      - name: Fingerprint vs latest store build
        if: ${{ !failure() && steps.changed.outputs.run == 'true' }}
        id: fp
        working-directory: mobile
        run: |
          build=""; update=""
          for p in ios android; do
            last=$(npx eas-cli@latest build:list -p "$p" --status finished \
              --distribution store --limit 1 --json --non-interactive \
              | sed -n '/^\[/,$p' | jq -r '.[0].id // empty')
            if [ -z "$last" ]; then
              echo "$p: no finished store build on EAS yet -> build"
              build="$build $p"; continue
            fi
            cmp=$(npx eas-cli@latest fingerprint:compare --build-id "$last" \
              --environment production --json --non-interactive | sed -n '/^{/,$p')
            remote=$(jq -r '.fingerprint1.hash // empty' <<<"$cmp")
            local=$(jq -r '.fingerprint2.hash // empty' <<<"$cmp")
            echo "$p: latest build $last fingerprint=$remote local=$local"
            if [ -n "$remote" ] && [ "$remote" = "$local" ]; then
              update="$update $p"
            else
              build="$build $p"
            fi
          done
          echo "build=${build# }" >> "$GITHUB_OUTPUT"
          echo "update=${update# }" >> "$GITHUB_OUTPUT"
      - name: OTA update (fingerprint unchanged)
        if: ${{ !failure() && steps.fp.outputs.update != '' }}
        working-directory: mobile
        run: |
          for p in ${{ steps.fp.outputs.update }}; do
            npx eas-cli@latest update --channel production --platform "$p" \
              --environment production --non-interactive \
              --message "${GITHUB_SHA::8}: $(git log -1 --format=%s | cut -c1-100)"
            echo "EAS OTA update published to channel production ($p)" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: EAS build + store submit (fingerprint changed)
        if: ${{ !failure() && steps.fp.outputs.build != '' }}
        working-directory: mobile
        run: |
          platforms="${{ steps.fp.outputs.build }}"
          [ "$platforms" = "ios android" ] && platforms=all
          npx eas-cli@latest build -p "$platforms" --profile production \
            --auto-submit --non-interactive --no-wait
          echo "EAS production build queued for $platforms (auto-submit to TestFlight / Play internal)" >> "$GITHUB_STEP_SUMMARY"

  # Green main runs push the backend and frontend images to GHCR as :main and
  # :sha-<short>. Dokploy only pulls them (compose.prod.yml has no build:), so
  # the server no longer compiles anything.
  publish-images:
    needs: [ci]
    if: ${{ !failure() && needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend and frontend
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short="${GITHUB_SHA::7}"
          for svc in backend frontend; do
            image="ghcr.io/$owner/clickfix-$svc"
            docker buildx build "./$svc" --push \
              --platform linux/amd64 \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --cache-from "type=gha,scope=$svc" \
              --cache-to "type=gha,scope=$svc,mode=max" \
              -t "$image:main" -t "$image:sha-$short"
            echo "pushed $image:main ($short)" >> "$GITHUB_STEP_SUMMARY"
          done

  # SDK release (CF-199): a green main run publishes @clickfix/node,
  # @getclickfix/visitor-core (CF-201) and @clickfix/react-widget to npm when
  # the version in package.json is not on the registry yet. Needs the
  # NPM_TOKEN repository secret (an npm automation token of the account that
  # owns the scopes); without it the job skips with a summary note and never
  # fails main. Versions and changelogs live in sdks/<package>/CHANGELOG.md.
  #
  # The same job publishes the Flutter package clickfix_webview to pub.dev
  # (CF-203) when its pubspec version is not on pub.dev yet. Needs the
  # PUB_CREDENTIALS repository secret: the content of the pub-credentials.json
  # file of the pub.dev publisher account (created by `dart pub token add
  # https://pub.dev` / a first `dart pub publish` on that machine). Without
  # it the Flutter steps skip with a summary note. The credentials file is
  # written to a job-private config directory and removed afterwards.
  sdk-publish:
    needs: [ci]
    if: ${{ !failure() && needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    steps:
      - uses: actions/checkout@v7
      # The token is exposed to the publish step only, never to pnpm install
      # or the tests (dependency install scripts must not see it).
      - name: Versions to publish
        id: todo
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret is not set: npm publish skipped (sdks/README.md, Yayın)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          list=""
          for p in node visitor-core react-widget; do
            name=$(jq -r .name "sdks/$p/package.json"); version=$(jq -r .version "sdks/$p/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm" >> "$GITHUB_STEP_SUMMARY"
            else
              list="$list $p"
            fi
          done
          echo "packages=${list# }" >> "$GITHUB_OUTPUT"
          [ -n "$list" ] && echo "run=true" >> "$GITHUB_OUTPUT" || { echo "run=false" >> "$GITHUB_OUTPUT"; echo "no new SDK version" >> "$GITHUB_STEP_SUMMARY"; }
      - uses: pnpm/action-setup@v6
        if: steps.todo.outputs.run == 'true'
        with:
          version: 11.22.0
          standalone: true
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        if: steps.todo.outputs.run == 'true'
        with:
          node-version-file: frontend/.nvmrc
          registry-url: https://registry.npmjs.org
      - name: Build
        if: steps.todo.outputs.run == 'true'
        working-directory: sdks
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Publish
        if: steps.todo.outputs.run == 'true'
        working-directory: sdks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in ${{ steps.todo.outputs.packages }}; do
            (cd "$p" && pnpm publish --no-git-checks --access public)
            echo "published $(jq -r .name "$p/package.json")@$(jq -r .version "$p/package.json")" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Flutter version to publish
        id: pub
        env:
          HAS_PUB: ${{ secrets.PUB_CREDENTIALS != '' }}
          PKG: sdks/flutter/clickfix_webview
        run: |
          if [ "$HAS_PUB" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PUB_CREDENTIALS secret is not set: pub.dev publish skipped (sdks/README.md, Yayın)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ ! -f "$PKG/LICENSE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$PKG/LICENSE is missing: pub.dev publish skipped" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          name=$(sed -n 's/^name: *//p' "$PKG/pubspec.yaml"); version=$(sed -n 's/^version: *//p' "$PKG/pubspec.yaml")
          if curl -fsS "https://pub.dev/api/packages/$name" | jq -e --arg v "$version" 'any(.versions[].version; . == $v)' >/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$name $version is already on pub.dev" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "package=$name" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.pub.outputs.run == 'true'
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Publish to pub.dev
        if: steps.pub.outputs.run == 'true'
        working-directory: sdks/flutter/clickfix_webview
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/pub-config
        run: |
          mkdir -p "$XDG_CONFIG_HOME/dart"
          printf '%s' "$PUB_CREDENTIALS" > "$XDG_CONFIG_HOME/dart/pub-credentials.json"
          trap 'rm -rf "$XDG_CONFIG_HOME"' EXIT
          flutter pub get
          flutter test
          dart pub publish --force
          echo "published ${{ steps.pub.outputs.package }} ${{ steps.pub.outputs.version }} to pub.dev" >> "$GITHUB_STEP_SUMMARY"

  # Every green main run not cancelled by a newer push tags its HEAD with the
  # next v0.N (first one: v0.1); Dokploy deploys on v0.* tag pushes and pulls
  # the :main images, so the tag waits until they are pushed. The same job
  # tags the Go SDK module (go/vX.Y.Z from sdks/go/VERSION) when that
  # version has no tag yet; nobody tags by hand (CF-199).
  release-tag:
    needs: [ci, publish-images]
    if: ${{ !failure() && needs.ci.result == 'success' && needs.publish-images.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        if: ${{ !failure() }}
        with:
          fetch-depth: 0
      - name: Tag next version
        if: ${{ !failure() }}
        run: |
          git fetch --tags --force
          if git tag --points-at HEAD | grep -qE '^v0\.[0-9]+$'; then
            echo "HEAD already tagged: $(git tag --points-at HEAD)"; exit 0
          fi
          last=$(git tag -l 'v0.*' | grep -E '^v0\.[0-9]+$' | sed 's/^v0\.//' | sort -n | tail -1 || true)
          next="v0.$(( ${last:-0} + 1 ))"
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
          echo "tagged $next" >> "$GITHUB_STEP_SUMMARY"

  # SDK mirror (CF-199): after the v0.N tag, the sdks/ tree is pushed to the
  # public repository ClickSolveMainTR/clickfix-sdks (read-only mirror, MIT)
  # and each package version is tagged there: node/vX.Y.Z, react-widget/vX.Y.Z,
  # visitor-core/vX.Y.Z, go/vX.Y.Z (Go module path
  # github.com/ClickSolveMainTR/clickfix-sdks/go), flutter/vX.Y.Z. Needs the
  # SDKS_MIRROR_KEY repository secret (private half of the mirror's write
  # deploy key); without it the job skips with a note and never fails main.
  # One mirror commit per release; history is not rewritten, tags are never moved.
  sdks-mirror:
    needs: [release-tag]
    if: ${{ !failure() && needs.release-tag.result == 'success' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","clickfix"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Mirror sdks/ to clickfix-sdks
        env:
          SDKS_MIRROR_KEY: ${{ secrets.SDKS_MIRROR_KEY }}
          MIRROR: git@github.com:ClickSolveMainTR/clickfix-sdks.git
        run: |
          if [ -z "$SDKS_MIRROR_KEY" ]; then
            echo "SDKS_MIRROR_KEY secret is not set: SDK mirror skipped" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$SDKS_MIRROR_KEY" > "$work/key"; chmod 600 "$work/key"
          ssh-keyscan -t ed25519 github.com > "$work/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $work/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$work/known_hosts"
          git clone --quiet --branch main "$MIRROR" "$work/mirror" || { git init --quiet -b main "$work/mirror"; git -C "$work/mirror" remote add origin "$MIRROR"; }
          rsync -a --delete --exclude .git sdks/ "$work/mirror/"
          cd "$work/mirror"
          git config user.name "clickfix-ci"; git config user.email "ci@getclickfix.com"
          release=$(git -C "$GITHUB_WORKSPACE" tag --points-at "$GITHUB_SHA" | grep -E '^v0\.[0-9]+$' | tail -1)
          git add -A
          if git diff --cached --quiet; then echo "mirror unchanged"; else
            git commit --quiet -m "clickfix-app-go ${release:-$GITHUB_SHA}"
            git push --quiet origin HEAD:main
            echo "mirrored sdks/ at ${release:-$GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          fi
          tag() {
            if git ls-remote --tags origin "refs/tags/$1" | grep -q .; then echo "$1 exists"; return; fi
            git tag "$1" HEAD && git push --quiet origin "refs/tags/$1" && echo "tagged $1" >> "$GITHUB_STEP_SUMMARY"
          }
          for p in node react-widget visitor-core; do
            [ -f "$p/package.json" ] && tag "$p/v$(jq -r .version "$p/package.json")"
          done
          [ -f go/VERSION ] && tag "go/v$(tr -d '[:space:]' < go/VERSION)"
          [ -f flutter/clickfix_webview/pubspec.yaml ] && tag "flutter/v$(sed -n 's/^version: *//p' flutter/clickfix_webview/pubspec.yaml)"
          true
