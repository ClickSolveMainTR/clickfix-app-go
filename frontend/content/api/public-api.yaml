  responses:
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: "`VALIDATION_ERROR`: `details[].field` names each invalid field (dotted path, e.g. `company.tax_number`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    apiChannelSignature:
      type: apiKey
      in: header
      name: X-ClickFix-Signature
      description: "`sha256=` + hex(HMAC-SHA256(secret, timestamp + \".\" + raw_body)), computed with the API channel's signing secret and sent together with `X-ClickFix-Timestamp` (Unix seconds)."
    integrationKey:
      type: http
      scheme: bearer
      bearerFormat: cf_sk_…
      description: "Organization API key (`cf_sk_…`), created under Organization → API and automations → API keys and sent as `Authorization: Bearer cf_sk_…`."
