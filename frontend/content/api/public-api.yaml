      properties:
        company_uuid:
          type: string
          format: uuid
        external_id:
          type: string
        domain:
          type: string
        source:
          type: string
          enum:
            - api
            - stripe
            - iyzico
        mrr_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
