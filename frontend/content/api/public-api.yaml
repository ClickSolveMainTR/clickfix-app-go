          minLength: 1
          maxLength: 255
          description: Stable unique message ID within this instance
        sender_id:
          type: string
          minLength: 1
          maxLength: 255
        sender_name:
          type: string
        text:
          type: string
          minLength: 1
          maxLength: 32000
        thread_id:
          type: string
          maxLength: 255
        reply_to:
          type: string
        at:
          type: string
          format: date-time
    APIChannelReply:
      type: object
      description: JSON posted to the organization's public webhook URL with timestamped HMAC and Idempotency-Key.
      required:
        - id
        - conversation_id
        - recipient_id
        - text
        - thread_id
        - reply_to
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        recipient_id:
          type: string
        text:
          type: string
        thread_id:
          type: string
        reply_to:
          type: string
    CompanyEvent:
      type: object
      required:
        - uuid
        - company_uuid
        - name
        - properties
        - source
        - occurred_at
        - duplicate
      properties:
        uuid:
          type: string
          format: uuid
        company_uuid:
          type: string
          format: uuid
        name:
          type: string
        properties:
          type: object
          additionalProperties: true
        source:
          type: string
