        - integrationKey: []
      description: "Scope: `triggers:read`. Returns the events of the chosen type after `cursor`; send `cursor=0` on the first call and keep the cursor from the response. Responses carry record ids, not conversation text. An expired cursor returns `410 CURSOR_EXPIRED`."
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/IntegrationTriggerPage"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
                required:
                  - success
                  - data
                  - meta
                additionalProperties: false
              example:
                success: true
                data:
                  items:
                    - id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                      event: conversation.created
                      entity_uuid: 8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f
                      occurred_at: 2026-11-11T09:15:00Z
                  next_cursor: 1762852500000:2c3d4e5f
                  has_more: false
                  retention_days: 7
                meta:
                  request_id: 01JCK9ZQ3M8R2W7X5E4T1N0PAB
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: "CURSOR_EXPIRED: resynchronize resources and restart with cursor=0"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: event
          in: query
          required: true
          schema:
