            - "null"
        timezone:
          type:
            - string
            - "null"
        notes:
          type: string
        custom_fields:
          type: object
          additionalProperties: true
        blocked:
          type: boolean
        channel_types:
          type: array
          items:
            type: string
        conversation_count:
          type: integer
          format: int64
        identities:
          type: array
