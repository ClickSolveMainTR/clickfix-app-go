          minLength: 3
          maxLength: 3
        plan:
          type: string
        billing_status:
          type: string
          enum:
            - none
            - trialing
            - active
            - past_due
            - canceled
        renewal_at:
          type:
            - string
            - "null"
          format: date-time
        lifetime_value_minor:
          type: integer
          format: int64
        source:
          type: string
          enum:
            - manual
            - api
            - stripe
            - iyzico
        external_ref:
          type: string
        updated_at:
          type: string
          format: date-time
    CompanyRevenueUpsertInput:
