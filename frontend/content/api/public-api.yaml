      description: "Scope: `conversations:write`. Give the contact as `contact_uuid` or, with your own user id, as `contact_external_id`. Contact and channel (`inbox_uuid`) must belong to the key's organization and the channel must be active. On a web widget channel the contact sees the conversation once they sign in on your site with `identify`. The conversation is assigned to the member who created the key. `Idempotency-Key` is required."
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        format: uuid
                      number:
                        type: integer
                      status:
                        type: string
                    required:
                      - uuid
                      - number
                      - status
                    additionalProperties: false
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
                required:
                  - success
                  - data
                  - meta
                additionalProperties: false
              example:
                success: true
                data:
