    post:
      operationId: receiveAPIChannelMessage
      summary: Send a customer message
      description: |
        Sends a customer message to the API channel. The channel is set up under **Channels → Add channel → API**; the setup gives you the inbound URL (`{instance}`), the signing secret and a field for the URL agent replies are sent to.

        The request is verified with the channel's signing secret, not an API key: `X-ClickFix-Timestamp` (Unix seconds) and `X-ClickFix-Signature: sha256=` + hex(HMAC-SHA256(secret, timestamp + "." + raw_body)). Requests whose timestamp is older than 5 minutes are rejected. A message with the same `id` is stored once. Retry on `5xx`.
      security:
        - apiChannelSignature: []
      parameters:
        - name: instance
          in: path
          required: true
          description: The channel instance id given during setup.
          schema:
            type: string
        - name: X-ClickFix-Timestamp
          in: header
          required: true
          description: Signing time (Unix seconds).
          schema:
            type: string
          example: "1761732900"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIChannelMessage"
            example:
              id: msg-1001
              sender_id: customer-42
              sender_name: Ayşe Yılmaz
              text: When will my order arrive?
      responses:
        "200":
          description: Message received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWebhookReceived"
              example:
                success: true
                data:
                  received: true
                  conversation_uuid: 8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f
                meta:
                  request_id: 01JCK9ZQ3M8R2W7X5E4T1N0PAB
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - API channel
      x-codeSamples:
        - lang: bash
          label: curl
          source: |-
            TIMESTAMP=$(date +%s)
            BODY='{
              "id": "msg-1001",
              "sender_id": "customer-42",
              "sender_name": "Ayşe Yılmaz",
              "text": "When will my order arrive?"
            }'
            SIGNATURE="sha256=$(printf '%s.%s' "$TIMESTAMP" "$BODY" | openssl dgst -sha256 -hmac "$CLICKFIX_CHANNEL_SECRET" | sed 's/^.* //')"

            curl -X POST "https://api.getclickfix.com/v1/webhooks/channels/api/CHANNEL_INSTANCE" \
              -H "Content-Type: application/json" \
              -H "X-ClickFix-Timestamp: $TIMESTAMP" \
              -H "X-ClickFix-Signature: $SIGNATURE" \
              -d "$BODY"
        - lang: typescript
          label: Node.js
          source: |-
            import { createHmac } from "node:crypto";

            const body = JSON.stringify({
              id: "msg-1001",
              sender_id: "customer-42",
              sender_name: "Ayşe Yılmaz",
              text: "When will my order arrive?"
            });
            const timestamp = String(Math.floor(Date.now() / 1000));
            const signature =
              "sha256=" +
              createHmac("sha256", process.env.CLICKFIX_CHANNEL_SECRET!)
                .update(`${timestamp}.`)
                .update(body)
                .digest("hex");

            const res = await fetch("https://api.getclickfix.com/v1/webhooks/channels/api/CHANNEL_INSTANCE", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-ClickFix-Timestamp": timestamp,
                "X-ClickFix-Signature": signature,
              },
              body,
            });
            console.log(res.status, await res.json());
        - lang: go
          label: Go
          source: |-
            body := []byte(`{
              "id": "msg-1001",
              "sender_id": "customer-42",
              "sender_name": "Ayşe Yılmaz",
              "text": "When will my order arrive?"
            }`)
            timestamp := strconv.FormatInt(time.Now().Unix(), 10)
            mac := hmac.New(sha256.New, []byte(os.Getenv("CLICKFIX_CHANNEL_SECRET")))
            mac.Write([]byte(timestamp + "."))
            mac.Write(body)
            signature := "sha256=" + hex.EncodeToString(mac.Sum(nil))

            req, _ := http.NewRequest("POST", "https://api.getclickfix.com/v1/webhooks/channels/api/CHANNEL_INSTANCE", bytes.NewReader(body))
            req.Header.Set("Content-Type", "application/json")
            req.Header.Set("X-ClickFix-Timestamp", timestamp)
            req.Header.Set("X-ClickFix-Signature", signature)
            res, err := http.DefaultClient.Do(req)
            if err != nil {
            	log.Fatal(err)
            }
            defer res.Body.Close()
            fmt.Println(res.StatusCode)
        - lang: php
          label: PHP
          source: |-
            <?php
            require __DIR__ . '/vendor/autoload.php';

            use ClickFix\Client;

            $client = new Client('https://api.getclickfix.com', getenv('CLICKFIX_API_KEY'));
            $channel = $client->apiChannel(getenv('CLICKFIX_CHANNEL_INSTANCE'), getenv('CLICKFIX_CHANNEL_SECRET'));

            $result = $channel->send([
                'id' => 'msg-1001',
                'sender_id' => 'customer-42',
                'sender_name' => 'Ayşe Yılmaz',
                'text' => 'When will my order arrive?',
            ]);
webhooks:
  apiChannelReply:
    post:
      tags:
        - API channel
      operationId: deliverAPIChannelReply
      summary: Agent reply (API channel)
      description: |
        When an agent replies to a conversation on the API channel, ClickFix sends a `POST` with this body to the URL configured on the channel. The request carries `X-ClickFix-Timestamp`, `X-ClickFix-Signature` (the signing method above) and `Idempotency-Key` (the message UUID); process every key only once. Return `2xx` after the message is stored durably. Temporary failures are retried with increasing delays; `4xx` responses other than `408` and `429` count as permanent failures.
      security: []
      parameters:
        - name: X-ClickFix-Timestamp
          in: header
          required: true
          schema:
            type: string
            description: Unix seconds
        - name: X-ClickFix-Signature
          in: header
          required: true
          schema:
            type: string
            description: sha256= followed by hex HMAC-SHA256
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIChannelReply"
            example:
              id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
              conversation_id: 8f0e5c2a-6b1d-4f3a-9c7e-2d4b6a8c0e1f
              recipient_id: customer-42
              text: Your order ships today.
              thread_id: msg-1001
              reply_to: msg-1001
      responses:
        "200":
          description: Durably accepted, including duplicate id
        "204":
          description: Durably accepted, including duplicate id
        "400":
          description: Permanent content rejection
        "401":
          description: Permanent authentication rejection
        "429":
          description: Rate limit, retried with backoff
        "500":
          description: Temporary receiver failure, retried with backoff
components:
