        billing_status:
          type: string
          enum:
            - none
            - trialing
            - active
            - past_due
            - canceled
        renewal_at:
          type:
            - string
            - "null"
          description: RFC 3339 time or YYYY-MM-DD date; null clears it.
        lifetime_value_minor:
          type: integer
          format: int64
