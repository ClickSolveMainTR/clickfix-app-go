openapi: 3.1.0
info:
  title: ClickFix API
  version: v1
  summary: Public REST API for conversations, contacts, companies, webhooks and the API channel
  description: |
    The ClickFix REST API lets you open conversations, add messages and internal notes, keep contacts and companies in sync with your own system, send customer-health signals and subscribe to events. Base URL `https://api.getclickfix.com/v1/public-api`; every request carries `Authorization: Bearer cf_sk_…`; writes require `Idempotency-Key`.

    Guides: [API keys, envelope, errors, pagination, rate limits](https://getclickfix.com/docs/api) · [Integration guide](https://getclickfix.com/docs/integration-guide) · [SDKs](https://getclickfix.com/docs/integration-guide/sdks) · [Webhooks](https://getclickfix.com/docs/webhooks).
  contact:
    name: ClickFix Support
    email: destek@getclickfix.com
    url: https://getclickfix.com/docs/api
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.getclickfix.com
    description: Production
security:
  - integrationKey: []
tags:
  - name: Conversations
    description: Create, read and update conversations; add messages and internal notes.
  - name: Contacts
    description: Contact records of your end customers, kept in sync with your own user ids (external ids).
  - name: Companies
    description: Company list and the revenue, usage and product-event signals that feed customer health.
  - name: Webhooks
    description: Manage event subscriptions. Delivery format and signature verification are described in the Webhooks guide.
  - name: Triggers
    description: Cursor-based polling and REST hook subscriptions for tools such as Zapier, Make and n8n.
  - name: API channel
    description: Connect your own chat system to ClickFix as a channel. You send customer messages; agent replies reach you by webhook.
  - name: Apps
    description: Public keys of the developer platform; verifying the signed context an embedded app receives.
paths:
  /v1/app-context/jwks:
    get:
      tags:
        - Apps
      operationId: getV1AppContextJwks
      summary: Read the app context verification keys
      security: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      keys:
                        type: array
                        items:
                          type: object
                          properties:
                            kty:
                              type: string
                            crv:
                              type: string
                            alg:
                              type: string
                            use:
                              type: string
                            kid:
                              type: string
                            x:
                              type: string
                    required:
                      - keys
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  keys:
                    - kty: OKP
                      crv: Ed25519
                      kid: 2026-11-a
                      x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                      use: sig
                      alg: EdDSA
                meta:
                  request_id: 01JCK9ZQ3M8R2W7X5E4T1N0PAB
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: No authentication. The JSON Web Key Set that signs the context token an embedded app (iframe) receives from the panel. Verify the token's signature with the key whose `kid` matches; keys rotate, so cache the set briefly and refetch on an unknown `kid`. See the Build your own app guide.
      x-codeSamples:
        - lang: bash
          label: curl
          source: curl "https://api.getclickfix.com/v1/app-context/jwks"
        - lang: typescript
          label: Node.js
          source: |-
            import { createRemoteJWKSet, jwtVerify } from "jose";

            const jwks = createRemoteJWKSet(new URL("https://api.getclickfix.com/v1/app-context/jwks"));
            // contextToken: the signed context the panel hands to your embedded app
            const { payload } = await jwtVerify(contextToken, jwks, {
              issuer: "https://getclickfix.com",
            });
            console.log(payload.org, payload.sub);
        - lang: go
          label: Go
          source: |-
            res, err := http.Get("https://api.getclickfix.com/v1/app-context/jwks")
            if err != nil {
            	log.Fatal(err)
            }
            defer res.Body.Close()
            var jwks struct {
            	Data struct {
            		Keys []map[string]string `json:"keys"`
            	} `json:"data"`
            }
            if err := json.NewDecoder(res.Body).Decode(&jwks); err != nil {
            	log.Fatal(err)
            }
            // pick the key whose "kid" matches the token header, then verify the EdDSA signature
        - lang: php
          label: PHP
          source: |-
            <?php
            $jwks = json_decode(file_get_contents('https://api.getclickfix.com/v1/app-context/jwks'), true)['data']['keys'];
            // pick the key whose 'kid' matches the token header, then verify the EdDSA signature
