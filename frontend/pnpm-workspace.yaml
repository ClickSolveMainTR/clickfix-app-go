packages:
  - "."

allowBuilds:
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - fumadocs-core@16.17.9
  - fumadocs-openapi@12.5.6
  - fumadocs-ui@16.17.9

# Transitive security fixes (pnpm audit --prod, CF-129). Each override stays in the
# dependency's current major; drop it once the parent package ships the fix itself.
overrides:
  # via @sentry/nextjs (minimatch 10)
  "brace-expansion@>=4.0.0 <5.0.11": "^5.0.12"
  # Dependabot alerts: transitive brace-expansion 1.x/2.x and js-yaml 4.x
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "^2.1.7"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  # via next > postcss
  "nanoid@<3.3.18": "^3.3.20"
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
  # Dependabot (CF-230): transitive minimatch 7-10 and glob 9-14.0.1
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
  "glob@>=9.0.0 <=14.0.1": "^14.0.2"

  # Build warnings (CF-153): lightningcss 1.32 does not know ::highlight() (used
  # by fumadocs-ui search) and warns on every build; 1.33 parses it. Drop once
  # @tailwindcss/node requires >=1.33.
  "lightningcss@<1.33.0": "^1.33.0"

# GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7, ReDoS via repeated extglobs): no patched
# release on npm yet (latest is 4.0.7). picomatch only sees glob patterns from build
# tooling, never user input. Remove this entry and add an override once 4.0.8 ships.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
