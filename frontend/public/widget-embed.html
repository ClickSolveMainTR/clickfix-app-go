<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>ClickFix</title>
    <style>
      /* Hosted webview shell (CF-199, docs/webview-bridge.md): the native
         app loads this page in a webview; the widget opens full screen and
         talks to the app through the bridge. Nothing else is on the page. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      // Query: widget (required public id), locale (tr|en), theme
      // (light|dark|auto), view (home|messages|help|new), conversation
      // (uuid, opens that conversation), consent=1 (consent already given
      // in the app). Everything else comes from the app over the bridge.
      (function () {
        var q = new URLSearchParams(location.search);
        var widgetId = (q.get("widget") || "").trim();
        if (!/^[A-Za-z0-9_-]{1,128}$/.test(widgetId)) {
          document.body.textContent = "widget query parameter is required";
          return;
        }
        var pick = function (key, allowed) {
          var v = q.get(key);
          return allowed.indexOf(v) >= 0 ? v : undefined;
        };
        var conversation = q.get("conversation") || "";
        var view = pick("view", ["home", "messages", "help", "new"]);
        window.ClickFix =
          window.ClickFix ||
          function () {
            (window.ClickFix.q = window.ClickFix.q || []).push(arguments);
          };
        ClickFix("boot", {
          widgetId: widgetId,
          locale: pick("locale", ["tr", "en"]),
          theme: pick("theme", ["light", "dark", "auto"]),
          hideLauncher: true,
          bridge: true,
          consent: q.get("consent") === "1" ? true : undefined,
        });
        // The app's own screen is the launcher: the panel is always open.
        ClickFix("on", "ready", function () {
          if (/^[A-Za-z0-9-]{1,64}$/.test(conversation))
            ClickFix("open", { conversation: conversation });
          else ClickFix("open", view);
        });
        ClickFix("on", "close", function () {
          // Closing inside the panel means "leave the support screen";
          // the app receives it as a clickfix:event and pops the webview.
        });
        var s = document.createElement("script");
        s.src = "/widget.js";
        s.async = true;
        s.dataset.manual = "true";
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
